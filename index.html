<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Тайна Совместимости 🔮</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

:root{
    --accent:#ff4f9c;
    --accent2:#8f54ff;
    --accent3:#ffc0df;
    --overlay1:rgba(255,43,137,.14);
    --overlay2:rgba(72,86,255,.16);
    --text:#fff3fb;
    --muted:#c8b7d8;
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;

    font-family:'Montserrat',sans-serif;
    color:var(--text);

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:34px 14px 70px;

    background-color:#050313;
    background-image:url("cosmic-bg.png");
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    background-attachment:fixed;

    overflow-x:hidden;
}

/* Затемняем центр под формой */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(5,3,18,.03) 0%,
            rgba(5,3,18,.12) 14%,
            rgba(5,3,18,.55) 31%,
            rgba(5,3,18,.82) 50%,
            rgba(5,3,18,.55) 69%,
            rgba(5,3,18,.12) 86%,
            rgba(5,3,18,.03) 100%
        ),
        radial-gradient(
            circle at 18% 25%,
            var(--overlay1),
            transparent 32%
        ),
        radial-gradient(
            circle at 84% 25%,
            var(--overlay2),
            transparent 34%
        );

    transition:background .8s ease;
}

/* Лёгкое затемнение сверху и снизу */
body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(2,1,10,.10),
            transparent 24%,
            transparent 72%,
            rgba(2,1,10,.26)
        );
}

/* Магические частицы */
.magic-particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.magic-particles span{
    position:absolute;
    opacity:0;

    color:var(--accent3);

    text-shadow:
        0 0 8px var(--accent),
        0 0 18px var(--accent2);

    animation:floatParticle 8s linear infinite;
}

.magic-particles span:nth-child(1){
    left:7%;
    top:70%;
    animation-delay:0s;
}

.magic-particles span:nth-child(2){
    left:17%;
    top:25%;
    animation-delay:2s;
}

.magic-particles span:nth-child(3){
    left:88%;
    top:30%;
    animation-delay:1s;
}

.magic-particles span:nth-child(4){
    left:91%;
    top:75%;
    animation-delay:4s;
}

.magic-particles span:nth-child(5){
    left:70%;
    top:10%;
    animation-delay:3s;
}

.magic-particles span:nth-child(6){
    left:30%;
    top:90%;
    animation-delay:5s;
}

.magic-particles span:nth-child(7){
    left:45%;
    top:82%;
    animation-delay:1.5s;
}

.magic-particles span:nth-child(8){
    left:60%;
    top:18%;
    animation-delay:4.5s;
}

@keyframes floatParticle{
    0%{
        transform:translateY(35px) rotate(0deg) scale(.5);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:.8;
    }

    100%{
        transform:translateY(-210px) rotate(220deg) scale(1.5);
        opacity:0;
    }
}

/* Основная карточка */
.quiz-card{
    position:relative;
    z-index:2;

    width:min(720px,94vw);

    padding:42px 44px 40px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(9,6,29,.84),
            rgba(5,3,20,.91)
        );

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border:1px solid rgba(255,80,180,.35);

    box-shadow:
        0 0 25px rgba(255,65,180,.13),
        0 0 75px rgba(65,85,255,.12),
        inset 0 0 40px rgba(255,255,255,.018);

    overflow:hidden;
}

.quiz-card::before{
    content:"";
    position:absolute;
    inset:7px;

    border-radius:21px;
    border:1px solid rgba(255,255,255,.055);

    pointer-events:none;
}

.quiz-card::after{
    content:"✦";
    position:absolute;

    top:-15px;
    left:50%;

    transform:translateX(-50%);

    font-size:38px;
    color:var(--accent3);

    text-shadow:
        0 0 10px var(--accent),
        0 0 28px var(--accent2);
}

/* Header */
.header{
    text-align:center;
    margin-bottom:26px;
}

.main-orb{
    font-size:40px;

    filter:
        drop-shadow(0 0 10px var(--accent))
        drop-shadow(0 0 20px var(--accent2));

    animation:pulse 2.5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }
}

h1{
    margin:4px 0 0;

    font-family:'Cormorant Garamond',serif;
    font-size:44px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            #fff1fa,
            var(--accent3),
            #bfc5ff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.subtitle{
    margin:7px 0 0;

    font-family:'Cormorant Garamond',serif;
    font-size:19px;

    color:#cfc0db;
}

/* Форма */
.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:flex;
    align-items:center;
    gap:8px;

    margin-bottom:8px;

    font-size:14px;
    font-weight:600;
    line-height:1.35;

    color:#fff5fb;
}

.icon{
    color:var(--accent3);
    font-size:18px;

    filter:drop-shadow(0 0 6px var(--accent));
}

input,
select,
textarea{
    width:100%;

    padding:13px 15px;

    border-radius:12px;

    border:1px solid rgba(255,80,180,.38);

    background:rgba(4,3,16,.68);

    color:#fff;

    outline:none;

    font-family:'Montserrat',sans-serif;
    font-size:14px;

    transition:.25s;
}

input::placeholder,
textarea::placeholder{
    color:#786c87;
}

select{
    cursor:pointer;
}

select option{
    background:#0a0717;
    color:#fff;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--accent);

    box-shadow:
        0 0 0 2px rgba(255,255,255,.03),
        0 0 20px color-mix(in srgb,var(--accent) 28%,transparent);

    transform:translateY(-1px);
}

/* Превью пары */
.compatibility-preview{
    margin:0 0 20px;

    padding:12px 14px;

    border-radius:13px;

    background:
        linear-gradient(
            90deg,
            rgba(255,61,160,.06),
            rgba(76,94,255,.07)
        );

    border:1px solid rgba(255,92,190,.22);

    text-align:center;

    font-family:'Cormorant Garamond',serif;
    font-size:20px;

    color:#fceeff;
}

.compatibility-preview span{
    color:var(--accent3);
}

/* Инфо энергии */
.energy-info{
    margin-top:8px;

    padding:11px 13px;

    border-radius:11px;

    background:
        color-mix(
            in srgb,
            var(--accent) 7%,
            transparent
        );

    border:
        1px solid
        color-mix(
            in srgb,
            var(--accent) 20%,
            transparent
        );

    color:#c9b8d7;

    font-family:'Cormorant Garamond',serif;
    font-size:16px;
    line-height:1.4;
}

/* Кнопка */
button{
    position:relative;

    width:100%;

    margin-top:8px;

    padding:16px 20px;

    border:0;
    border-radius:50px;

    cursor:pointer;

    color:#fff;

    font-family:'Montserrat',sans-serif;
    font-size:15px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent2),
            var(--accent)
        );

    background-size:200% 100%;

    box-shadow:
        0 0 18px color-mix(in srgb,var(--accent) 35%,transparent),
        0 0 38px color-mix(in srgb,var(--accent2) 20%,transparent);

    overflow:hidden;

    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    background-position:100% 0;
}

button:disabled{
    cursor:default;
    opacity:.9;
}

button::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:65%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3s infinite;
}

@keyframes shine{
    0%{
        left:-100%;
    }

    40%,100%{
        left:150%;
    }
}

/* Magic */
.hidden{
    display:none!important;
}

#magicBlock{
    text-align:center;
    padding:35px 10px;
}

.magic-title{
    font-family:'Cormorant Garamond',serif;
    font-size:29px;

    margin-bottom:30px;

    color:#ffeefa;
}

.magic-circle{
    position:relative;

    width:210px;
    height:210px;

    margin:0 auto 30px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.circle{
    position:absolute;
    inset:0;

    border-radius:50%;

    border:
        1px solid
        color-mix(
            in srgb,
            var(--accent) 70%,
            transparent
        );

    box-shadow:
        0 0 18px color-mix(in srgb,var(--accent) 35%,transparent);

    animation:rotate 6s linear infinite;
}

.circle:nth-child(2){
    inset:18px;

    border-color:
        color-mix(
            in srgb,
            var(--accent2) 70%,
            transparent
        );

    animation:rotateReverse 8s linear infinite;
}

.circle:nth-child(3){
    inset:38px;
    border-style:dashed;

    animation:rotate 4.5s linear infinite;
}

.circle:nth-child(4){
    inset:58px;

    border-color:rgba(255,255,255,.22);

    animation:rotateReverse 3.5s linear infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateReverse{
    to{
        transform:rotate(-360deg);
    }
}

.magic-rune{
    font-size:58px;

    filter:
        drop-shadow(0 0 12px var(--accent))
        drop-shadow(0 0 22px var(--accent2));

    animation:pulse 1.7s infinite;
}

.magic-status{
    min-height:30px;

    font-family:'Cormorant Garamond',serif;
    font-size:21px;

    color:#cbbad8;
}

/* Результат */
#successBlock{
    text-align:center;

    padding:18px 5px 5px;
}

.success-title{
    font-family:'Cormorant Garamond',serif;
    font-size:30px;

    margin-bottom:10px;
}

.result-pair{
    font-family:'Cormorant Garamond',serif;
    font-size:24px;

    color:var(--accent3);

    margin-bottom:10px;
}

#percentResult{
    display:block;

    font-size:72px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            #e7b4ff,
            var(--accent3)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.verdict-text{
    max-width:580px;

    margin:15px auto 0;

    font-family:'Cormorant Garamond',serif;
    font-size:21px;
    line-height:1.6;

    color:#ddcee7;
}

/* Мобильная версия */
@media(max-width:650px){

    body{
        padding:14px 8px 40px;

        background-size:auto 100vh;
        background-position:center top;
        background-attachment:fixed;
    }

    body::before{
        background:
            rgba(5,3,18,.50);
    }

    .quiz-card{
        width:100%;
        padding:34px 18px 28px;
        border-radius:22px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:17px;
    }

    #percentResult{
        font-size:58px;
    }
}
</style>
</head>

        accent:"#ff4f9c",
        symbol:"💗",
        text:"💗 Сердце открыто любви, теплу и сильному притяжению."
    },

    "Загадочная энергия 🔮":{
        accent:"#a855ff",
        symbol:"🔮",
        text:"🔮 Сегодня вокруг тебя особенно много тайн и скрытых знаков."
    },

    "Авантюрная энергия ⚡":{
        accent:"#ff9d38",
        symbol:"⚡",
        text:"⚡ Судьба намекает на движение, приключения и неожиданные повороты."
    },

    "Спокойная энергия 🌙":{
        accent:"#6da5ff",
        symbol:"🌙",
        text:"🌙 Спокойная энергия усиливает доверие и искренние чувства."
    },

    "Дерзкая энергия 😎":{
        accent:"#ff477e",
        symbol:"😎",
        text:"😎 Сегодня хочется играть по своим правилам и бросить вызов судьбе."
    }

};

const form =
    document.getElementById("loveForm");

const zodiac1 =
    document.getElementById("zodiac1");

const zodiac2 =
    document.getElementById("zodiac2");

const feelings =
    document.getElementById("feelings");

const preview =
    document.getElementById("compatibilityPreview");

const energyInfo =
    document.getElementById("energyInfo");

const magicBlock =
    document.getElementById("magicBlock");

const successBlock =
    document.getElementById("successBlock");

const magicRune =
    document.getElementById("magicRune");

const magicStatus =
    document.getElementById("magicStatus");

function applyTheme(){

    let element="water";

    if(
        zodiac1.value &&
        zodiacData[zodiac1.value]
    ){
        element=
            zodiacData[zodiac1.value].element;
    }

    const zodiacTheme =
        zodiacThemes[element];

    const energyTheme =
        energyThemes[feelings.value];

    document.documentElement.style.setProperty(
        "--accent",
        energyTheme.accent
    );

    document.documentElement.style.setProperty(
        "--accent2",
        zodiacTheme.accent2
    );

    document.documentElement.style.setProperty(
        "--accent3",
        zodiacTheme.accent3
    );

    document.documentElement.style.setProperty(
        "--overlay1",
        zodiacTheme.overlay1
    );

    document.documentElement.style.setProperty(
        "--overlay2",
        zodiacTheme.overlay2
    );

    magicRune.innerText=
        energyTheme.symbol;

    energyInfo.innerText=
        energyTheme.text;
}

function updatePreview(){

    if(
        zodiac1.value &&
        zodiac2.value
    ){

        const z1=
            zodiacData[zodiac1.value];

        const z2=
            zodiacData[zodiac2.value];

        preview.innerHTML=
            `<span>${z1.symbol}</span> ${z1.name} &nbsp; × &nbsp; ${z2.name} <span>${z2.symbol}</span>`;

    }else{

        preview.innerHTML=
            "<span>✦</span> Выбери два знака <span>✦</span>";

    }

}

zodiac1.addEventListener(
    "change",
    ()=>{
        applyTheme();
        updatePreview();
    }
);

zodiac2.addEventListener(
    "change",
    updatePreview
);

feelings.addEventListener(
    "change",
    applyTheme
);

applyTheme();

form.addEventListener(
    "submit",
    async(e)=>{

        e.preventDefault();

        const button=
            form.querySelector("button");

        const payload={

            name:
                document.getElementById("name").value,

            zodiac1:
                zodiac1.value,

            zodiac2:
                zodiac2.value,

            feelings:
                feelings.value,

            date:
                document.getElementById("date").value,

            place:
                document.getElementById("place").value,

            time:
                document.getElementById("time").value,

            message:
                document.getElementById("message").value

        };

        button.disabled=true;

        form.classList.add(
            "hidden"
        );

        magicBlock.classList.remove(
            "hidden"
        );

        const z1=
            zodiacData[zodiac1.value];

        const z2=
            zodiacData[zodiac2.value];

        const messages=[

            `Соединяем ${z1.name} и ${z2.name}`,

            "Сверяем стихии",

            "Изучаем энергию сердца",

            "Проверяем эмоциональную гармонию",

            "Считываем притяжение созвездий",

            "Звёзды почти закончили анализ..."

        ];

        let index=0;

        magicStatus.innerText=
            messages[0];

        const magicInterval=
            setInterval(()=>{

                index++;

                if(index < messages.length){

                    magicStatus.innerText=
                        messages[index];

                }

            },900);

        try{

            const response=
                await fetch(
                    "https://ser-4983.onrender.com/api/send",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(payload)
                    }
                );

            const result=
                await response.json();

            clearInterval(
                magicInterval
            );

            magicBlock.classList.add(
                "hidden"
            );

            if(result.success){

                successBlock.classList.remove(
                    "hidden"
                );

                document.getElementById(
                    "resultPair"
                ).innerText=
                    `${z1.symbol} ${z1.name} × ${z2.name} ${z2.symbol}`;

                document.getElementById(
                    "percentResult"
                ).innerText=
                    result.percentage+"%";

                document.getElementById(
                    "verdictResult"
                ).innerText=
                    result.verdict;

            }else{

                form.classList.remove(
                    "hidden"
                );

                button.disabled=false;

                alert(
                    "Ошибка: "+
                    (
                        result.error ||
                        "неизвестная ошибка"
                    )
                );

            }

        }catch(error){

            clearInterval(
                magicInterval
            );

            magicBlock.classList.add(
                "hidden"
            );

            form.classList.remove(
                "hidden"
            );

            button.disabled=false;

            alert(
                "Сервер просыпается. Подожди немного и попробуй ещё раз."
            );

            console.error(error);

        }

    }
);

</script>

</body>
</html>
