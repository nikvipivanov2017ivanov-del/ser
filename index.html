<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Тайна Совместимости 🔮</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

:root{
--pink:#ff5ca8;
--purple:#9b5cff;
--bg:#080510;
--text:#fff1fa;
--muted:#bcaacb;
}

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
font-family:Montserrat,sans-serif;
color:var(--text);
background:
radial-gradient(circle at 50% 15%,rgba(148,65,255,.25),transparent 35%),
radial-gradient(circle at 15% 80%,rgba(255,67,171,.18),transparent 30%),
radial-gradient(circle at 90% 70%,rgba(112,54,255,.18),transparent 30%),
#080510;
display:flex;
justify-content:center;
align-items:center;
padding:30px 15px;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background-image:
radial-gradient(circle,#fff 1px,transparent 1px),
radial-gradient(circle,#ffb9e8 1px,transparent 1px),
radial-gradient(circle,#b889ff 1px,transparent 1px);
background-size:97px 113px,151px 173px,211px 191px;
opacity:.4;
animation:stars 18s linear infinite;
}

@keyframes stars{
from{transform:translateY(0)}
to{transform:translateY(-80px)}
}

.magic-particles{
position:fixed;
inset:0;
pointer-events:none;
z-index:0;
}

.magic-particles span{
position:absolute;
color:#ff8fd4;
font-size:18px;
opacity:0;
animation:float 8s linear infinite;
}

.magic-particles span:nth-child(1){left:8%;top:75%;animation-delay:0s}
.magic-particles span:nth-child(2){left:18%;top:25%;animation-delay:2s}
.magic-particles span:nth-child(3){left:82%;top:30%;animation-delay:1s}
.magic-particles span:nth-child(4){left:91%;top:75%;animation-delay:4s}
.magic-particles span:nth-child(5){left:70%;top:10%;animation-delay:3s}
.magic-particles span:nth-child(6){left:30%;top:90%;animation-delay:5s}

@keyframes float{
0%{
transform:translateY(30px) scale(.5) rotate(0);
opacity:0;
}
20%{opacity:1}
80%{opacity:.8}
100%{
transform:translateY(-180px) scale(1.5) rotate(180deg);
opacity:0;
}
}

.quiz-card{
position:relative;
z-index:2;
width:min(680px,100%);
padding:45px;
border-radius:28px;
background:linear-gradient(145deg,rgba(25,15,45,.96),rgba(8,5,18,.96));
border:1px solid rgba(255,157,220,.55);
box-shadow:
0 0 25px rgba(255,79,180,.15),
0 0 90px rgba(121,61,255,.16);
overflow:hidden;
}

.header{
text-align:center;
margin-bottom:32px;
}

.symbol{
font-size:38px;
margin-bottom:5px;
animation:pulse 2.5s ease-in-out infinite;
filter:drop-shadow(0 0 12px #ff5db6);
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.13)}
}

h1{
margin:0;
font-family:Cormorant Garamond,serif;
font-size:43px;
font-weight:700;
background:linear-gradient(90deg,#ffb5df,#fff0fa,#d59cff);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.subtitle{
margin:7px 0 0;
font-family:Cormorant Garamond,serif;
font-size:20px;
color:#cdbbd9;
}

.subtitle span{
color:#ff91d2;
}

.form-group{
margin-bottom:21px;
}

label{
display:flex;
align-items:center;
gap:9px;
margin-bottom:8px;
font-size:14px;
font-weight:600;
}

.icon{
color:#ff9ed8;
font-size:18px;
}

input,
select,
textarea{
width:100%;
padding:14px 16px;
color:#fff;
background:rgba(8,5,18,.72);
border:1px solid rgba(255,157,220,.42);
border-radius:13px;
outline:none;
font-family:Montserrat,sans-serif;
font-size:14px;
transition:.3s;
}

input::placeholder,
textarea::placeholder{
color:#806f91;
}

select{
cursor:pointer;
}

select option{
background:#171026;
color:#fff;
}

textarea{
resize:vertical;
min-height:105px;
}

input:focus,
select:focus,
textarea:focus{
border-color:#ff79c7;
box-shadow:
0 0 0 2px rgba(255,93,184,.08),
0 0 22px rgba(255,74,179,.16);
}

button{
width:100%;
margin-top:8px;
padding:16px;
border:0;
border-radius:50px;
cursor:pointer;
color:#fff;
font-size:15px;
font-weight:700;
background:linear-gradient(90deg,#8f3cff,#ff4fa8,#a744ff);
box-shadow:
0 0 18px rgba(255,76,173,.45),
0 0 40px rgba(132,62,255,.25);
}

button:hover{
transform:translateY(-2px);
}

.hidden{
display:none!important;
}

#magicBlock{
text-align:center;
padding:30px 10px;
}

.magic-title{
font-family:Cormorant Garamond,serif;
font-size:28px;
margin-bottom:30px;
}

.magic-circle{
position:relative;
width:190px;
height:190px;
margin:0 auto 30px;
display:flex;
align-items:center;
justify-content:center;
}

.circle{
position:absolute;
inset:0;
border-radius:50%;
border:1px solid rgba(255,143,211,.7);
animation:rotate 5s linear infinite;
}

.circle:nth-child(2){
inset:18px;
border-color:rgba(170,111,255,.7);
animation:rotateReverse 7s linear infinite;
}

.circle:nth-child(3){
inset:38px;
border-style:dashed;
animation:rotate 4s linear infinite;
}

@keyframes rotate{
to{transform:rotate(360deg)}
}

@keyframes rotateReverse{
to{transform:rotate(-360deg)}
}

.rune{
font-size:54px;
filter:drop-shadow(0 0 15px #ff6dc0);
}

.magic-status{
font-family:Cormorant Garamond,serif;
font-size:21px;
color:#cdbbd9;
}

#successBlock{
text-align:center;
padding:15px 10px;
}

.success-msg{
font-family:Cormorant Garamond,serif;
font-size:28px;
}

#percentResult{
display:block;
font-size:65px;
font-weight:700;
background:linear-gradient(90deg,#ff76c7,#d8a0ff,#ffb4df);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.verdict-text{
font-family:Cormorant Garamond,serif;
font-size:21px;
line-height:1.6;
color:#d6c6df;
}

@media(max-width:600px){
.quiz-card{
padding:36px 22px;
}

h1{
font-size:34px;
}
}
</style>
</head>

<body>

<div class="magic-particles">
<span>✦</span>
<span>✧</span>
<span>♡</span>
<span>✦</span>
<span>✧</span>
<span>♡</span>
</div>

<div class="quiz-card">

<form id="loveForm">

<div class="header">
<div class="symbol">🔮</div>
<h1>Тайна Совместимости</h1>
<p class="subtitle">
Совместимость со <span>Стрельцом 🏹</span>
</p>
</div>

<div class="form-group">
<label>
<span class="icon">✦</span>
Как тебя зовут?
</label>

<input
type="text"
id="name"
required
placeholder="Напиши своё имя..."
>
</div>

<div class="form-group">
<label>
<span class="icon">♐</span>
Какой у тебя знак зодиака?
</label>

<select id="zodiac" required>
<option value="">Выбери свой знак...</option>
<option value="овен">♈ Овен</option>
<option value="телец">♉ Телец</option>
<option value="близнецы">♊ Близнецы</option>
<option value="рак">♋ Рак</option>
<option value="лев">♌ Лев</option>
<option value="дева">♍ Дева</option>
<option value="весы">♎ Весы</option>
<option value="скорпион">♏ Скорпион</option>
<option value="стрелец">♐ Стрелец</option>
<option value="козерог">♑ Козерог</option>
<option value="водолей">♒ Водолей</option>
<option value="рыбы">♓ Рыбы</option>
</select>
</div>

<div class="form-group">
<label>
<span class="icon">☾</span>
Какая энергия сегодня живёт в твоём сердце?
</label>

<select id="feelings">
<option value="Влюблённая энергия 💗">Влюблённая энергия 💗</option>
<option value="Загадочная энергия 🔮">Загадочная энергия 🔮</option>
<option value="Авантюрная энергия ⚡">Авантюрная энергия ⚡</option>
<option value="Спокойная энергия 🌙">Спокойная энергия 🌙</option>
<option value="Мне нравится статус-код 200 😏">Мне нравится статус-код 200 😏</option>
</select>
</div>

<div class="form-group">
<label>
<span class="icon">✧</span>
Как выглядит твоё идеальное свидание?
</label>

<input
type="text"
id="date"
required
placeholder="Например: прогулка под луной..."
>
</div>

<div class="form-group">
<label>
<span class="icon">♡</span>
Где должна произойти встреча?
</label>

<input
type="text"
id="place"
required
placeholder="Кафе, парк, море, кино..."
>
</div>

<div class="form-group">
<label>
<span class="icon">◷</span>
Когда звёзды должны пересечься?
</label>

<input
type="text"
id="time"
required
placeholder="Например: сегодня вечером..."
>
</div>

<div class="form-group">
<label>
<span class="icon">🔐</span>
Тайное послание
</label>

<textarea
id="message"
placeholder="Можешь написать что-нибудь тайное..."
></textarea>
</div>

<button type="submit">
✨ Узнать совместимость со Стрельцом ✨
</button>

</form>

<div id="magicBlock" class="hidden">

<div class="magic-title">
Звёзды начинают расчёт...
</div>

<div class="magic-circle">
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="rune">♐</div>
</div>

<div class="magic-status" id="magicStatus">
Сравниваем ваши созвездия...
</div>

</div>

<div id="successBlock" class="hidden">

<p class="success-msg">
🔮 Звёзды вынесли свой вердикт
</p>

<span id="percentResult">
0%
</span>

<p class="verdict-text" id="verdictResult">
Звёзды ещё молчат...
</p>

</div>

</div>

<script>
const form = document.getElementById("loveForm");
const magicBlock = document.getElementById("magicBlock");
const successBlock = document.getElementById("successBlock");
const magicStatus = document.getElementById("magicStatus");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const button = form.querySelector("button");

    const payload = {
        name: document.getElementById("name").value,
        zodiac: document.getElementById("zodiac").value,
        feelings: document.getElementById("feelings").value,
        date: document.getElementById("date").value,
        place: document.getElementById("place").value,
        time: document.getElementById("time").value,
        message: document.getElementById("message").value
    };

    button.disabled = true;

    form.classList.add("hidden");
    magicBlock.classList.remove("hidden");

    const messages = [
        "Сравниваем ваши созвездия...",
        "Изучаем огонь Стрельца...",
        "Проверяем притяжение стихий...",
        "Читаем энергию сердца...",
        "Ищем знаки судьбы...",
        "Почти готово..."
    ];

    let messageIndex = 0;

    const magicInterval = setInterval(() => {
        messageIndex++;

        if (messageIndex < messages.length) {
            magicStatus.innerText = messages[messageIndex];
        }
    }, 900);

    try {
        const response = await fetch(
            "https://ser-4983.onrender.com/api/send",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            }
        );

        const result = await response.json();

        clearInterval(magicInterval);

        magicBlock.classList.add("hidden");

        if (result.success) {
            successBlock.classList.remove("hidden");

            document.getElementById("percentResult").innerText =
                result.percentage + "%";

            document.getElementById("verdictResult").innerText =
                result.verdict;
        } else {
            form.classList.remove("hidden");
            button.disabled = false;

            alert(
                "Ошибка при расчёте: " +
                (result.error || "неизвестная ошибка")
            );
        }
    } catch (error) {
        clearInterval(magicInterval);

        magicBlock.classList.add("hidden");
        form.classList.remove("hidden");
        button.disabled = false;

        alert(
            "Сервер просыпается. Если Render только запустился, подожди около 30 секунд и попробуй снова."
        );

        console.error(error);
    }
});
</script>

</body>
</html>
