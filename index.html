<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Тайна Совместимости 🔮</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

:root{
    --accent:#ff5ca8;
    --accent2:#9b5cff;
    --accent3:#ff9ed8;

    --bg1:#090512;
    --bg2:#180a2b;
    --bg3:#13061e;

    --text:#fff1fa;
    --muted:#c8b6d8;

    --element-glow:rgba(255,92,168,.25);
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Montserrat',sans-serif;
    color:var(--text);

    background:
        radial-gradient(circle at 18% 20%,var(--element-glow),transparent 32%),
        radial-gradient(circle at 82% 30%,rgba(155,92,255,.20),transparent 32%),
        radial-gradient(circle at 50% 90%,rgba(255,70,170,.15),transparent 38%),
        linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));

    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:45px 15px;

    overflow-x:hidden;

    transition:
        background 1s ease,
        filter .8s ease;
}

/* =========================
   ЗВЁЗДЫ
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#ffb7df 1px,transparent 1px),
        radial-gradient(circle,#a7a8ff 1px,transparent 1px);

    background-size:
        90px 110px,
        150px 170px,
        220px 190px;

    background-position:
        10px 20px,
        50px 80px,
        100px 10px;

    opacity:.35;

    animation:starsMove 25s linear infinite;
}

@keyframes starsMove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-120px);
    }
}

/* =========================
   НЕБУЛА
========================= */

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background:
        radial-gradient(
            ellipse at center bottom,
            var(--element-glow),
            transparent 60%
        );

    opacity:.6;
}

/* =========================
   ЧАСТИЦЫ
========================= */

.magic-particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.magic-particles span{
    position:absolute;
    opacity:0;

    color:var(--accent3);

    text-shadow:
        0 0 8px var(--accent),
        0 0 18px var(--accent2);

    animation:floatParticle 8s linear infinite;
}

.magic-particles span:nth-child(1){
    left:7%;
    top:70%;
    animation-delay:0s;
}

.magic-particles span:nth-child(2){
    left:17%;
    top:20%;
    animation-delay:2s;
}

.magic-particles span:nth-child(3){
    left:88%;
    top:30%;
    animation-delay:1s;
}

.magic-particles span:nth-child(4){
    left:92%;
    top:75%;
    animation-delay:4s;
}

.magic-particles span:nth-child(5){
    left:70%;
    top:8%;
    animation-delay:3s;
}

.magic-particles span:nth-child(6){
    left:30%;
    top:90%;
    animation-delay:5s;
}

.magic-particles span:nth-child(7){
    left:45%;
    top:82%;
    animation-delay:1.5s;
}

.magic-particles span:nth-child(8){
    left:60%;
    top:18%;
    animation-delay:4.5s;
}

@keyframes floatParticle{
    0%{
        transform:
            translateY(40px)
            rotate(0deg)
            scale(.5);

        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:.8;
    }

    100%{
        transform:
            translateY(-220px)
            rotate(220deg)
            scale(1.6);

        opacity:0;
    }
}

/* =========================
   КАРТОЧКА
========================= */

.quiz-card{
    position:relative;
    z-index:2;

    width:min(720px,100%);

    padding:48px 45px 42px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(25,15,45,.93),
            rgba(8,5,18,.95)
        );

    backdrop-filter:blur(16px);

    border:
        1px solid
        color-mix(in srgb,var(--accent) 60%,transparent);

    box-shadow:
        0 0 25px var(--element-glow),
        0 0 90px rgba(117,60,255,.15),
        inset 0 0 60px rgba(255,255,255,.025);

    overflow:hidden;

    transition:
        border-color .6s,
        box-shadow .6s;
}

.quiz-card::before{
    content:"";
    position:absolute;

    inset:8px;

    border-radius:23px;

    border:
        1px solid
        rgba(255,255,255,.08);

    pointer-events:none;
}

.quiz-card::after{
    content:"✦";

    position:absolute;

    top:-17px;
    left:50%;

    transform:translateX(-50%);

    font-size:42px;

    color:var(--accent3);

    text-shadow:
        0 0 10px var(--accent),
        0 0 30px var(--accent2);
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:28px;
}

.main-orb{
    font-size:40px;

    filter:
        drop-shadow(0 0 10px var(--accent))
        drop-shadow(0 0 20px var(--accent2));

    animation:orbPulse 2.5s ease-in-out infinite;
}

@keyframes orbPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.14);
    }
}

h1{
    margin:5px 0 0;

    font-family:'Cormorant Garamond',serif;

    font-size:46px;

    font-weight:700;

    background:
        linear-gradient(
            90deg,
            #fff0fa,
            var(--accent3),
            #d9b6ff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.subtitle{
    margin:6px 0 0;

    font-family:'Cormorant Garamond',serif;

    font-size:20px;

    color:var(--muted);
}

/* =========================
   ПАРА ЗНАКОВ
========================= */

.compatibility-preview{
    margin:0 0 26px;

    padding:14px 16px;

    border-radius:15px;

    border:
        1px solid
        color-mix(in srgb,var(--accent) 35%,transparent);

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );

    text-align:center;

    font-family:'Cormorant Garamond',serif;

    font-size:22px;

    color:#fbefff;

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.02),
        0 0 15px var(--element-glow);

    transition:.5s;
}

.compatibility-preview span{
    color:var(--accent3);
}

/* =========================
   FORM
========================= */

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:8px;

    font-size:14px;

    font-weight:600;

    color:#fff5fb;
}

.icon{
    color:var(--accent3);

    font-size:18px;

    filter:
        drop-shadow(0 0 6px var(--accent));
}

input,
select,
textarea{
    width:100%;

    padding:14px 16px;

    border-radius:13px;

    border:
        1px solid
        color-mix(in srgb,var(--accent) 45%,transparent);

    background:
        rgba(7,5,16,.75);

    color:#fff;

    outline:none;

    font-family:'Montserrat',sans-serif;

    font-size:14px;

    transition:
        .3s border,
        .3s box-shadow,
        .3s transform;
}

input::placeholder,
textarea::placeholder{
    color:#7e6f8f;
}

select{
    cursor:pointer;
}

select option{
    background:#130c20;
    color:#fff;
}

textarea{
    min-height:105px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--accent);

    box-shadow:
        0 0 0 2px
        color-mix(in srgb,var(--accent) 12%,transparent),
        0 0 25px
        var(--element-glow);

    transform:translateY(-1px);
}

/* =========================
   ЭНЕРГИЯ INFO
========================= */

.energy-info{
    margin-top:8px;

    padding:11px 13px;

    border-radius:11px;

    background:
        color-mix(in srgb,var(--accent) 7%,transparent);

    border:
        1px solid
        color-mix(in srgb,var(--accent) 22%,transparent);

    color:#cbbbd8;

    font-family:'Cormorant Garamond',serif;

    font-size:17px;

    line-height:1.35;

    transition:.4s;
}

/* =========================
   BUTTON
========================= */

button{
    position:relative;

    width:100%;

    margin-top:10px;

    padding:17px 20px;

    border:0;

    border-radius:50px;

    cursor:pointer;

    color:white;

    font-family:'Montserrat',sans-serif;

    font-size:15px;

    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--accent2),
            var(--accent),
            var(--accent3)
        );

    background-size:200% 100%;

    box-shadow:
        0 0 22px var(--element-glow),
        0 0 50px rgba(132,62,255,.25);

    overflow:hidden;

    transition:.3s;
}

button:hover{
    transform:translateY(-3px);

    background-position:100% 0;
}

button::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:65%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3s infinite;
}

@keyframes shine{
    0%{
        left:-100%;
    }

    40%,100%{
        left:150%;
    }
}

/* =========================
   MAGIC BLOCK
========================= */

.hidden{
    display:none!important;
}

#magicBlock{
    text-align:center;
    padding:35px 10px;
}

.magic-title{
    font-family:'Cormorant Garamond',serif;

    font-size:30px;

    margin-bottom:30px;

    color:#ffeafa;
}

.magic-circle{
    position:relative;

    width:220px;
    height:220px;

    margin:0 auto 30px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.circle{
    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid
        color-mix(in srgb,var(--accent) 70%,transparent);

    box-shadow:
        0 0 20px var(--element-glow),
        inset 0 0 25px var(--element-glow);

    animation:rotate 6s linear infinite;
}

.circle:nth-child(2){
    inset:18px;

    border-color:
        color-mix(in srgb,var(--accent2) 75%,transparent);

    animation:rotateReverse 8s linear infinite;
}

.circle:nth-child(3){
    inset:38px;

    border-style:dashed;

    animation:rotate 4.5s linear infinite;
}

.circle:nth-child(4){
    inset:60px;

    border-color:rgba(255,255,255,.25);

    animation:rotateReverse 3.5s linear infinite;
}

.magic-rune{
    font-size:60px;

    filter:
        drop-shadow(0 0 12px var(--accent))
        drop-shadow(0 0 22px var(--accent2));

    animation:orbPulse 1.7s infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateReverse{
    to{
        transform:rotate(-360deg);
    }
}

.magic-status{
    min-height:30px;

    font-family:'Cormorant Garamond',serif;

    font-size:22px;

    color:var(--muted);
}

/* =========================
   RESULT
========================= */

#successBlock{
    text-align:center;

    padding:20px 5px 5px;
}

.success-title{
    font-family:'Cormorant Garamond',serif;

    font-size:30px;

    margin-bottom:10px;
}

.result-pair{
    font-family:'Cormorant Garamond',serif;

    font-size:24px;

    color:var(--accent3);

    margin-bottom:15px;
}

#percentResult{
    display:block;

    font-size:72px;

    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            #e6b0ff,
            var(--accent3)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(0 0 15px var(--element-glow));
}

.verdict-text{
    max-width:560px;

    margin:15px auto 0;

    font-family:'Cormorant Garamond',serif;

    font-size:22px;

    line-height:1.6;

    color:#ddcce5;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

    body{
        padding:18px 10px;
    }

    .quiz-card{
        padding:38px 20px 32px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    h1{
        font-size:36px;
    }

    .subtitle{
        font-size:18px;
    }

    #percentResult{
        font-size:58px;
    }

}
</style>

        bg3:"#100724",

        glow:"rgba(75,135,255,.30)"
    },

    air:{
        accent:"#66e5ff",
        accent2:"#8a6cff",
        accent3:"#d3f6ff",

        bg1:"#030a16",
        bg2:"#071d2b",
        bg3:"#0d102d",

        glow:"rgba(89,220,255,.27)"
    },

    earth:{
        accent:"#d2a55f",
        accent2:"#7e9b57",
        accent3:"#f4d89c",

        bg1:"#0c0905",
        bg2:"#171409",
        bg3:"#111308",

        glow:"rgba(180,150,75,.25)"
    }

};


/* =========================
   ENERGY THEMES
========================= */

const energyThemes = {

    "Влюблённая энергия 💗":{
        accent:"#ff4f9c",
        symbol:"💗",
        text:"💗 Сердце открыто любви, теплу и притяжению."
    },

    "Загадочная энергия 🔮":{
        accent:"#a855ff",
        symbol:"🔮",
        text:"🔮 Вокруг тебя сегодня много тайн и скрытых знаков."
    },

    "Авантюрная энергия ⚡":{
        accent:"#ff9d38",
        symbol:"⚡",
        text:"⚡ Судьба намекает на приключения и неожиданные повороты."
    },

    "Спокойная энергия 🌙":{
        accent:"#6da5ff",
        symbol:"🌙",
        text:"🌙 Тихая энергия усиливает искренность и глубокие чувства."
    },

    "Дерзкая энергия 😎":{
        accent:"#ff477e",
        symbol:"😎",
        text:"😎 Сегодня ты готов играть по своим правилам."
    }

};


/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById("loveForm");

const zodiac1 =
document.getElementById("zodiac1");

const zodiac2 =
document.getElementById("zodiac2");

const feelings =
document.getElementById("feelings");

const preview =
document.getElementById(
    "compatibilityPreview"
);

const energyInfo =
document.getElementById(
    "energyInfo"
);

const magicBlock =
document.getElementById(
    "magicBlock"
);

const successBlock =
document.getElementById(
    "successBlock"
);

const magicRune =
document.getElementById(
    "magicRune"
);

const magicStatus =
document.getElementById(
    "magicStatus"
);


/* =========================
   APPLY THEME
========================= */

function applyTheme(){

    let primaryElement="water";

    if(
        zodiac1.value &&
        zodiacData[zodiac1.value]
    ){
        primaryElement =
            zodiacData[
                zodiac1.value
            ].element;
    }

    const elementTheme =
        elementThemes[
            primaryElement
        ];

    const energyTheme =
        energyThemes[
            feelings.value
        ];

    document.documentElement
    .style
    .setProperty(
        "--accent",
        energyTheme.accent
    );

    document.documentElement
    .style
    .setProperty(
        "--accent2",
        elementTheme.accent2
    );

    document.documentElement
    .style
    .setProperty(
        "--accent3",
        elementTheme.accent3
    );

    document.documentElement
    .style
    .setProperty(
        "--bg1",
        elementTheme.bg1
    );

    document.documentElement
    .style
    .setProperty(
        "--bg2",
        elementTheme.bg2
    );

    document.documentElement
    .style
    .setProperty(
        "--bg3",
        elementTheme.bg3
    );

    document.documentElement
    .style
    .setProperty(
        "--element-glow",
        elementTheme.glow
    );

    magicRune.innerText =
        energyTheme.symbol;

    energyInfo.innerText =
        energyTheme.text;
}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    if(
        zodiac1.value &&
        zodiac2.value
    ){

        const z1 =
            zodiacData[
                zodiac1.value
            ];

        const z2 =
            zodiacData[
                zodiac2.value
            ];

        preview.innerHTML =
            `<span>${z1.symbol}</span> ${z1.name} &nbsp; × &nbsp; ${z2.name} <span>${z2.symbol}</span>`;

    }else{

        preview.innerHTML =
            "<span>✦</span> Выбери два знака <span>✦</span>";

    }

}


/* =========================
   CHANGE EVENTS
========================= */

zodiac1.addEventListener(
    "change",
    ()=>{
        applyTheme();
        updatePreview();
    }
);

zodiac2.addEventListener(
    "change",
    ()=>{
        updatePreview();
    }
);

feelings.addEventListener(
    "change",
    ()=>{
        applyTheme();
    }
);


/* =========================
   INITIAL THEME
========================= */

applyTheme();


/* =========================
   SUBMIT
========================= */

form.addEventListener(
    "submit",
    async(e)=>{

        e.preventDefault();

        const button =
            form.querySelector(
                "button"
            );

        const payload = {

            name:
                document
                .getElementById(
                    "name"
                )
                .value,

            zodiac1:
                zodiac1.value,

            zodiac2:
                zodiac2.value,

            feelings:
                feelings.value,

            date:
                document
                .getElementById(
                    "date"
                )
                .value,

            place:
                document
                .getElementById(
                    "place"
                )
                .value,

            time:
                document
                .getElementById(
                    "time"
                )
                .value,

            message:
                document
                .getElementById(
                    "message"
                )
                .value

        };

        button.disabled=true;

        form.classList.add(
            "hidden"
        );

        magicBlock.classList.remove(
            "hidden"
        );

        const z1 =
            zodiacData[
                zodiac1.value
            ];

        const z2 =
            zodiacData[
                zodiac2.value
            ];

        const messages=[

            `Соединяем ${z1.name} и ${z2.name}`,

            "Сверяем ваши стихии",

            "Изучаем энергию сердца",

            "Ищем точки притяжения",

            "Читаем карту созвездий",

            "Звёзды почти закончили расчёт..."

        ];

        let messageIndex=0;

        magicStatus.innerText=
            messages[0];

        const magicInterval=
            setInterval(
                ()=>{

                    messageIndex++;

                    if(
                        messageIndex <
                        messages.length
                    ){

                        magicStatus
                        .innerText =
                            messages[
                                messageIndex
                            ];

                    }

                },
                900
            );

        try{

            const response =
                await fetch(
                    "https://ser-4983.onrender.com/api/send",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

            const result =
                await response.json();

            clearInterval(
                magicInterval
            );

            magicBlock
            .classList
            .add(
                "hidden"
            );

            if(
                result.success
            ){

                successBlock
                .classList
                .remove(
                    "hidden"
                );

                document
                .getElementById(
                    "resultPair"
                )
                .innerText =
                    `${z1.symbol} ${z1.name} × ${z2.name} ${z2.symbol}`;

                document
                .getElementById(
                    "percentResult"
                )
                .innerText =
                    result.percentage +
                    "%";

                document
                .getElementById(
                    "verdictResult"
                )
                .innerText =
                    result.verdict;

            }else{

                form
                .classList
                .remove(
                    "hidden"
                );

                button.disabled=false;

                alert(
                    "Ошибка: "+
                    (
                        result.error ||
                        "неизвестная ошибка"
                    )
                );

            }

        }catch(error){

            clearInterval(
                magicInterval
            );

            magicBlock
            .classList
            .add(
                "hidden"
            );

            form
            .classList
            .remove(
                "hidden"
            );

            button.disabled=false;

            alert(
                "Сервер просыпается. Подожди немного и попробуй снова."
            );

            console.error(
                error
            );

        }

    }
);

</script>

</body>
</html>
