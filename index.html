<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайна Совместимости 🔮</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #fff0f3;
            --text: #590d22;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
            max-width: 450px;
            width: 90%;
        }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffb3c1;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .success-msg { text-align: center; color: var(--primary); font-size: 24px; font-weight: bold; }
        .verdict-text { text-align: center; font-size: 16px; color: #590d22; line-height: 1.5; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="quiz-card">
    <form id="loveForm">
        <h2>Тайна Совместимости 🔮</h2>
        
        <div class="form-group">
            <label>✦ Как тебя зовут, странник?</label>
            <input type="text" id="name" required placeholder="Ваше имя">
        </div>

        <div class="form-group">
            <label>🪐 Твой знак зодиака:</label>
            <select id="zodiac" required>
                <option value="" disabled selected>Выберите знак...</option>
                <option value="Овен">Овен ♈</option>
                <option value="Телец">Телец ♉</option>
                <option value="Близнецы">Близнецы ♊</option>
                <option value="Рак">Рак ♋</option>
                <option value="Лев">Лев ♌</option>
                <option value="Дева">Дева ♍</option>
                <option value="Весы">Весы ♎</option>
                <option value="Скорпион">Скорпион ♏</option>
                <option value="Стрелец">Стрелец ♐</option>
                <option value="Козерог">Козерог ♑</option>
                <option value="Водолей">Водолей ♒</option>
                <option value="Рыбы">Рыбы ♓</option>
            </select>
        </div>

        <div class="form-group">
            <label>☾ Какая энергия сегодня живёт в твоём сердце?</label>
            <select id="feelings">
                <option value="Влюблённая энергия 💗">Влюблённая энергия 💗</option>
                <option value="Загадочная энергия 🔮">Загадочная энергия 🔮</option>
                <option value="Авантюрная энергия ⚡">Авантюрная энергия ⚡</option>
                <option value="Спокойная энергия 🌙">Спокойная энергия 🌙</option>
                <option value="Мне нравится статус-код 200 😏">Мне нравится статус-код 200 😏</option>
            </select>
        </div>

        <div class="form-group">
            <label>✧ Как выглядит твоё идеальное свидание?</label>
            <input type="text" id="date" required placeholder="Например: Прогулка под звёздами">
        </div>

        <div class="form-group">
            <label>♡ Где судьба должна устроить вашу встречу?</label>
            <input type="text" id="place" required placeholder="Например: Уютное кафе">
        </div>

        <div class="form-group">
            <label>◷ Когда звёзды должны пересечься?</label>
            <input type="text" id="time" required placeholder="Например: В эти выходные">
        </div>

        <div class="form-group">
            <label>🔐 Есть ли у тебя тайное послание?</label>
            <textarea id="message" rows="3" placeholder="Ваши мысли..."></textarea>
        </div>

        <button type="submit">✨ Узнать, что приготовила судьба ✨</button>
    </form>

    <div id="successBlock" class="hidden">
        <h2 style="margin-bottom: 5px;">Вердикт Магии 🔮</h2>
        <p class="success-msg"><span id="percentResult">0%</span></p>
        <p class="verdict-text" id="verdictResult">Соединяем ваши звёзды...</p>
    </div>
</div>

<script>
    document.getElementById('loveForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            name: document.getElementById('name').value,
            zodiac: document.getElementById('zodiac').value,
            feelings: document.getElementById('feelings').value,
            date: document.getElementById('date').value,
            place: document.getElementById('place').value,
            time: document.getElementById('time').value,
            message: document.getElementById('message').value
        };

        try {
            document.getElementById('loveForm').classList.add('hidden');
            document.getElementById('successBlock').classList.remove('hidden');
            document.getElementById('verdictResult').innerText = "Магия читает ваши созвездия...";

            const response = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                document.getElementById('percentResult').innerText = result.percentage + '%';
                document.getElementById('verdictResult').innerText = result.verdict;
            } else {
                alert('Магия прервалась: ' + JSON.stringify(result.error));
            }
        } catch (error) {
            alert('Звёзды просыпаются. Попробуйте нажать кнопку еще раз через 20 секунд!');
            console.error(error);
        }
    });
</script>

</body>
</html>
