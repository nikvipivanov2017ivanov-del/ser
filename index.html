<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Тайна Совместимости 🔮</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

:root{
    --accent:#ff4f9c;
    --accent2:#8f54ff;
    --accent3:#ffc0df;

    --overlay1:rgba(255,43,137,.15);
    --overlay2:rgba(72,86,255,.18);

    --text:#fff3fb;
    --muted:#c8b7d8;
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;

    font-family:'Montserrat',sans-serif;
    color:var(--text);

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:45px 15px 80px;

    background-image:
        linear-gradient(
            rgba(3,2,15,.28),
            rgba(5,2,18,.38)
        ),
        url("cosmic-bg.png");

    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    background-attachment:fixed;

    overflow-x:hidden;
}

/* =====================================
   ЦВЕТНАЯ АТМОСФЕРА ПОВЕРХ ФОНА
===================================== */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 18% 25%,
            var(--overlay1),
            transparent 36%
        ),
        radial-gradient(
            circle at 84% 27%,
            var(--overlay2),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 50% 90%,
            rgba(255,58,171,.12),
            transparent 50%
        );

    transition:background .9s ease;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(3,2,14,.05),
            rgba(3,1,14,.18)
        );
}

/* =====================================
   ЧАСТИЦЫ
===================================== */

.magic-particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.magic-particles span{
    position:absolute;

    color:var(--accent3);

    opacity:0;

    text-shadow:
        0 0 8px var(--accent),
        0 0 20px var(--accent2);

    animation:floatParticle 9s linear infinite;
}

.magic-particles span:nth-child(1){
    left:7%;
    top:70%;
    animation-delay:0s;
}

.magic-particles span:nth-child(2){
    left:16%;
    top:27%;
    animation-delay:2s;
}

.magic-particles span:nth-child(3){
    left:88%;
    top:30%;
    animation-delay:1s;
}

.magic-particles span:nth-child(4){
    left:91%;
    top:75%;
    animation-delay:4s;
}

.magic-particles span:nth-child(5){
    left:72%;
    top:9%;
    animation-delay:3s;
}

.magic-particles span:nth-child(6){
    left:30%;
    top:90%;
    animation-delay:5s;
}

.magic-particles span:nth-child(7){
    left:44%;
    top:80%;
    animation-delay:1.5s;
}

.magic-particles span:nth-child(8){
    left:60%;
    top:18%;
    animation-delay:4.5s;
}

@keyframes floatParticle{
    0%{
        transform:translateY(40px) rotate(0) scale(.5);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:.8;
    }

    100%{
        transform:translateY(-220px) rotate(220deg) scale(1.5);
        opacity:0;
    }
}

/* =====================================
   ОСНОВНАЯ КАРТОЧКА
===================================== */

.quiz-card{
    position:relative;
    z-index:2;

    width:min(760px,100%);

    padding:48px 45px 42px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(9,7,30,.91),
            rgba(7,5,25,.87)
        );

    backdrop-filter:blur(18px);

    border:1px solid
        color-mix(
            in srgb,
            var(--accent) 65%,
            transparent
        );

    box-shadow:
        0 0 20px rgba(255,68,170,.18),
        0 0 55px rgba(100,60,255,.15),
        inset 0 0 45px rgba(255,255,255,.025);

    overflow:hidden;
}

.quiz-card::before{
    content:"";
    position:absolute;
    inset:8px;

    border-radius:23px;

    border:1px solid rgba(255,255,255,.08);

    pointer-events:none;
}

.quiz-card::after{
    content:"✦";

    position:absolute;

    top:-18px;
    left:50%;

    transform:translateX(-50%);

    font-size:44px;

    color:var(--accent3);

    text-shadow:
        0 0 8px var(--accent),
        0 0 28px var(--accent2);
}

/* =====================================
   HEADER
===================================== */

.header{
    text-align:center;
    margin-bottom:28px;
}

.main-orb{
    font-size:43px;

    filter:
        drop-shadow(0 0 10px var(--accent))
        drop-shadow(0 0 22px var(--accent2));

    animation:pulse 2.5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.13);
    }
}

h1{
    margin:4px 0 0;

    font-family:'Cormorant Garamond',serif;

    font-size:48px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            #fff1fa,
            var(--accent3),
            #c5b6ff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 28px rgba(255,110,190,.12);
}

.subtitle{
    margin:7px 0 0;

    font-family:'Cormorant Garamond',serif;

    font-size:20px;

    color:#d1c0de;
}

/* =====================================
   ФОРМА
===================================== */

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px;
}

.form-group{
    margin-bottom:21px;
}

label{
    display:flex;
    align-items:center;
    gap:8px;

    margin-bottom:8px;

    font-size:14px;
    font-weight:600;

    color:#fff5fb;
}

.icon{
    color:var(--accent3);

    font-size:18px;

    filter:
        drop-shadow(0 0 6px var(--accent));
}

input,
select,
textarea{
    width:100%;

    padding:14px 16px;

    border-radius:13px;

    border:
        1px solid
        color-mix(
            in srgb,
            var(--accent) 48%,
            transparent
        );

    background:rgba(5,4,18,.76);

    color:#fff;

    outline:none;

    font-family:'Montserrat',sans-serif;
    font-size:14px;

    box-shadow:
        inset 0 0 15px rgba(105,65,255,.04);

    transition:.3s;
}

input::placeholder,
textarea::placeholder{
    color:#7f718f;
}

select{
    cursor:pointer;
}

select option{
    background:#0b071a;
    color:#fff;
}

textarea{
    min-height:105px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--accent);

    box-shadow:
        0 0 0 2px
        color-mix(
            in srgb,
            var(--accent) 12%,
            transparent
        ),
        0 0 25px
        color-mix(
            in srgb,
            var(--accent) 25%,
            transparent
        );

    transform:translateY(-1px);
}

/* =====================================
   ПАРА ЗНАКОВ
===================================== */

.compatibility-preview{
    margin:0 0 24px;

    padding:14px;

    border-radius:14px;

    text-align:center;

    font-family:'Cormorant Garamond',serif;
    font-size:22px;

    color:#fceeff;

    border:
        1px solid
        color-mix(
            in srgb,
            var(--accent) 35%,
            transparent
        );

    background:
        linear-gradient(
            90deg,
            rgba(255,63,163,.06),
            rgba(90,75,255,.08),
            rgba(255,63,163,.06)
        );

    box-shadow:
        0 0 18px
        color-mix(
            in srgb,
            var(--accent) 14%,
            transparent
        );
}

.compatibility-preview span{
    color:var(--accent3);
}

/* =====================================
   ЭНЕРГИЯ
===================================== */

.energy-info{
    margin-top:8px;

    padding:12px 14px;

    border-radius:11px;

    background:
        color-mix(
            in srgb,
            var(--accent) 8%,
            transparent
        );

    border:
        1px solid
        color-mix(
            in srgb,
            var(--accent) 24%,
            transparent
        );

    color:#cab9d7;

    font-family:'Cormorant Garamond',serif;
    font-size:17px;
    line-height:1.4;
}

/* =====================================
   BUTTON
===================================== */

button{
    position:relative;

    width:100%;

    margin-top:10px;

    padding:17px;

    border:0;

    border-radius:50px;

    cursor:pointer;

    color:#fff;

    font-family:'Montserrat',sans-serif;
    font-size:15px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent2),
            var(--accent)
        );

    background-size:200% 100%;

    box-shadow:
        0 0 20px
        color-mix(
            in srgb,
            var(--accent) 40%,
            transparent
        ),
        0 0 40px
        color-mix(
            in srgb,
            var(--accent2) 25%,
            transparent
        );

    overflow:hidden;

    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    background-position:100% 0;
}

button::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:65%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3s infinite;
}

@keyframes shine{
    0%{
        left:-100%;
    }

    40%,100%{
        left:150%;
    }
}

/* =====================================
   MAGIC
===================================== */

.hidden{
    display:none!important;
}

#magicBlock{
    text-align:center;
    padding:35px 10px;
}

.magic-title{
    font-family:'Cormorant Garamond',serif;
    font-size:30px;

    margin-bottom:30px;
}

.magic-circle{
    position:relative;

    width:220px;
    height:220px;

    margin:0 auto 30px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.circle{
    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid
        color-mix(
            in srgb,
            var(--accent) 70%,
            transparent
        );

    box-shadow:
        0 0 20px
        color-mix(
            in srgb,
            var(--accent) 40%,
            transparent
        );

    animation:rotate 6s linear infinite;
}

.circle:nth-child(2){
    inset:18px;

    border-color:
        color-mix(
            in srgb,
            var(--accent2) 70%,
            transparent
        );

    animation:rotateReverse 8s linear infinite;
}

.circle:nth-child(3){
    inset:38px;
    border-style:dashed;

    animation:rotate 4.5s linear infinite;
}

.circle:nth-child(4){
    inset:60px;

    border-color:rgba(255,255,255,.25);

    animation:rotateReverse 3.5s linear infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateReverse{
    to{
        transform:rotate(-360deg);
    }
}

.magic-rune{
    font-size:60px;

    filter:
        drop-shadow(0 0 12px var(--accent))
        drop-shadow(0 0 22px var(--accent2));

    animation:pulse 1.7s infinite;
}

.magic-status{
    min-height:30px;

    font-family:'Cormorant Garamond',serif;
    font-size:22px;

    color:#cbbad8;
}

/* =====================================
   RESULT
===================================== */

#successBlock{
    text-align:center;
    padding:20px 5px 5px;
}

.success-title{
    font-family:'Cormorant Garamond',serif;

    font-size:31px;

    margin-bottom:10px;
}

.result-pair{
    font-family:'Cormorant Garamond',serif;

    font-size:24px;

    color:var(--accent3);

    margin-bottom:12px;
}

#percentResult{
    display:block;

    font-size:74px;

    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            #e7b4ff,
            var(--accent3)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.verdict-text{
    max-width:580px;

    margin:15px auto 0;

    font-family:'Cormorant Garamond',serif;

    font-size:22px;

    line-height:1.6;

    color:#ddcee7;
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:650px){

    body{
        padding:18px 10px 50px;

        background-position:center top;
    }

    .quiz-card{
        padding:38px 20px 32px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    h1{
        font-size:36px;
    }

    .subtitle{
        font-size:18px;
    }

    #percentResult{
        font-size:58px;
    }
}
</style>

        accent:"#57dfff",
        accent2:"#716cff",
        accent3:"#d8f8ff",

        overlay1:"rgba(47,196,255,.18)",
        overlay2:"rgba(83,82,255,.17)"
    },

    earth:{
        accent:"#cf9e61",
        accent2:"#7da05b",
        accent3:"#f5db9d",

        overlay1:"rgba(176,121,61,.17)",
        overlay2:"rgba(95,125,56,.15)"
    }

};

const energyThemes = {

    "Влюблённая энергия 💗":{
        accent:"#ff4f9c",
        symbol:"💗",

        text:
            "💗 Сердце открыто любви, теплу, нежности и сильному притяжению."
    },

    "Загадочная энергия 🔮":{
        accent:"#a855ff",
        symbol:"🔮",

        text:
            "🔮 Вокруг тебя сегодня чувствуется интрига и множество скрытых знаков."
    },

    "Авантюрная энергия ⚡":{
        accent:"#ff9d38",
        symbol:"⚡",

        text:
            "⚡ Судьба намекает на приключения, движение и неожиданные повороты."
    },

    "Спокойная энергия 🌙":{
        accent:"#6da5ff",
        symbol:"🌙",

        text:
            "🌙 Спокойствие усиливает доверие, искренность и глубокие чувства."
    },

    "Дерзкая энергия 😎":{
        accent:"#ff477e",
        symbol:"😎",

        text:
            "😎 Сегодня хочется играть по своим правилам и немного бросить вызов судьбе."
    }

};

const form =
    document.getElementById(
        "loveForm"
    );

const zodiac1 =
    document.getElementById(
        "zodiac1"
    );

const zodiac2 =
    document.getElementById(
        "zodiac2"
    );

const feelings =
    document.getElementById(
        "feelings"
    );

const preview =
    document.getElementById(
        "compatibilityPreview"
    );

const energyInfo =
    document.getElementById(
        "energyInfo"
    );

const magicBlock =
    document.getElementById(
        "magicBlock"
    );

const successBlock =
    document.getElementById(
        "successBlock"
    );

const magicRune =
    document.getElementById(
        "magicRune"
    );

const magicStatus =
    document.getElementById(
        "magicStatus"
    );

function applyTheme(){

    let element="water";

    if(
        zodiac1.value &&
        zodiacData[zodiac1.value]
    ){
        element=
            zodiacData[
                zodiac1.value
            ].element;
    }

    const zodiacTheme =
        zodiacThemes[element];

    const energyTheme =
        energyThemes[
            feelings.value
        ];

    document
    .documentElement
    .style
    .setProperty(
        "--accent",
        energyTheme.accent
    );

    document
    .documentElement
    .style
    .setProperty(
        "--accent2",
        zodiacTheme.accent2
    );

    document
    .documentElement
    .style
    .setProperty(
        "--accent3",
        zodiacTheme.accent3
    );

    document
    .documentElement
    .style
    .setProperty(
        "--overlay1",
        zodiacTheme.overlay1
    );

    document
    .documentElement
    .style
    .setProperty(
        "--overlay2",
        zodiacTheme.overlay2
    );

    magicRune.innerText =
        energyTheme.symbol;

    energyInfo.innerText =
        energyTheme.text;
}

function updatePreview(){

    if(
        zodiac1.value &&
        zodiac2.value
    ){

        const z1 =
            zodiacData[
                zodiac1.value
            ];

        const z2 =
            zodiacData[
                zodiac2.value
            ];

        preview.innerHTML =
            `<span>${z1.symbol}</span> ${z1.name} &nbsp; × &nbsp; ${z2.name} <span>${z2.symbol}</span>`;

    }else{

        preview.innerHTML =
            "<span>✦</span> Выбери два знака <span>✦</span>";

    }

}

zodiac1.addEventListener(
    "change",
    ()=>{

        applyTheme();

        updatePreview();

    }
);

zodiac2.addEventListener(
    "change",
    updatePreview
);

feelings.addEventListener(
    "change",
    applyTheme
);

applyTheme();

form.addEventListener(
    "submit",
    async(e)=>{

        e.preventDefault();

        const button =
            form.querySelector(
                "button"
            );

        const payload={

            name:
                document
                .getElementById(
                    "name"
                )
                .value,

            zodiac1:
                zodiac1.value,

            zodiac2:
                zodiac2.value,

            feelings:
                feelings.value,

            date:
                document
                .getElementById(
                    "date"
                )
                .value,

            place:
                document
                .getElementById(
                    "place"
                )
                .value,

            time:
                document
                .getElementById(
                    "time"
                )
                .value,

            message:
                document
                .getElementById(
                    "message"
                )
                .value

        };

        button.disabled=true;

        form.classList.add(
            "hidden"
        );

        magicBlock.classList.remove(
            "hidden"
        );

        const z1 =
            zodiacData[
                zodiac1.value
            ];

        const z2 =
            zodiacData[
                zodiac2.value
            ];

        const messages=[

            `Соединяем ${z1.name} и ${z2.name}`,

            "Сверяем ваши стихии",

            "Изучаем энергию сердца",

            "Проверяем эмоциональную гармонию",

            "Считываем притяжение созвездий",

            "Звёзды почти закончили анализ..."

        ];

        let index=0;

        magicStatus.innerText=
            messages[0];

        const magicInterval=
            setInterval(
                ()=>{

                    index++;

                    if(
                        index <
                        messages.length
                    ){

                        magicStatus
                        .innerText =
                            messages[index];

                    }

                },
                900
            );

        try{

            const response =
                await fetch(
                    "https://ser-4983.onrender.com/api/send",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );

            const result =
                await response.json();

            clearInterval(
                magicInterval
            );

            magicBlock
            .classList
            .add(
                "hidden"
            );

            if(
                result.success
            ){

                successBlock
                .classList
                .remove(
                    "hidden"
                );

                document
                .getElementById(
                    "resultPair"
                )
                .innerText =
                    `${z1.symbol} ${z1.name} × ${z2.name} ${z2.symbol}`;

                document
                .getElementById(
                    "percentResult"
                )
                .innerText =
                    result.percentage +
                    "%";

                document
                .getElementById(
                    "verdictResult"
                )
                .innerText =
                    result.verdict;

            }else{

                form
                .classList
                .remove(
                    "hidden"
                );

                button.disabled=false;

                alert(
                    "Ошибка: "+
                    (
                        result.error ||
                        "неизвестная ошибка"
                    )
                );

            }

        }catch(error){

            clearInterval(
                magicInterval
            );

            magicBlock
            .classList
            .add(
                "hidden"
            );

            form
            .classList
            .remove(
                "hidden"
            );

            button.disabled=false;

            alert(
                "Сервер просыпается. Подожди немного и попробуй ещё раз."
            );

            console.error(
                error
            );

        }

    }
);

</script>

</html>
