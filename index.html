<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тайна Совместимости 🔮</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

:root{
    --left:#5175ff;
    --right:#ff445a;
    --energy:#ff4f9c;
    --text:#fff4fb;
    --muted:#cdbbd8;
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Montserrat',sans-serif;
    color:var(--text);
    background:#03020d;
    overflow-x:hidden;
}

/* =========================
   ФОНЫ
========================= */

.zodiac-background{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:#03020d;
}

.zodiac-side{
    position:absolute;
    top:0;
    bottom:0;
    width:55%;

    background-repeat:no-repeat;
    background-size:cover;
    background-position:center center;

    transition:
        opacity .8s ease,
        filter .8s ease,
        background-image .8s ease,
        background-position .8s ease;
}

.left-side{
    left:0;
}

.right-side{
    right:0;
}

/* затемнение каждой картинки */
.zodiac-side::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.06),
            rgba(0,0,0,.02) 35%,
            rgba(0,0,0,.16) 78%,
            rgba(0,0,0,.38)
        );

    pointer-events:none;
}

/* плавное соединение */
.zodiac-background::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            90deg,

            rgba(2,1,10,.03) 0%,
            rgba(2,1,10,.08) 18%,

            rgba(2,1,10,.22) 32%,
            rgba(2,1,10,.48) 41%,

            rgba(2,1,10,.72) 47%,
            rgba(2,1,10,.84) 50%,
            rgba(2,1,10,.72) 53%,

            rgba(2,1,10,.48) 59%,
            rgba(2,1,10,.22) 68%,

            rgba(2,1,10,.08) 82%,
            rgba(2,1,10,.03) 100%
        );
}

/* =========================
   СВЕЧЕНИЕ
========================= */

.left-glow{
    position:fixed;
    inset:0 50% 0 0;
    z-index:1;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 18% 28%,
            color-mix(in srgb,var(--left) 20%,transparent),
            transparent 42%
        );

    mix-blend-mode:screen;
    transition:.8s;
}

.right-glow{
    position:fixed;
    inset:0 0 0 50%;
    z-index:1;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 82% 28%,
            color-mix(in srgb,var(--right) 20%,transparent),
            transparent 42%
        );

    mix-blend-mode:screen;
    transition:.8s;
}

/* =========================
   ЧАСТИЦЫ
========================= */

.particles{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
}

.particles span{
    position:absolute;
    opacity:0;
    font-size:16px;
    filter:drop-shadow(0 0 8px currentColor);
    animation:particleFloat 8s linear infinite;
}

.particles span:nth-child(odd){
    color:var(--left);
}

.particles span:nth-child(even){
    color:var(--right);
}

.particles span:nth-child(1){left:6%;top:73%}
.particles span:nth-child(2){left:15%;top:46%;animation-delay:2s}
.particles span:nth-child(3){left:28%;top:89%;animation-delay:4s}
.particles span:nth-child(4){left:72%;top:82%;animation-delay:1s}
.particles span:nth-child(5){left:86%;top:48%;animation-delay:3s}
.particles span:nth-child(6){left:95%;top:73%;animation-delay:5s}
.particles span:nth-child(7){left:18%;top:20%;animation-delay:1.4s}
.particles span:nth-child(8){left:80%;top:18%;animation-delay:4.3s}

@keyframes particleFloat{
    0%{
        opacity:0;
        transform:translateY(30px) rotate(0deg) scale(.6);
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:.75;
    }

    100%{
        opacity:0;
        transform:translateY(-180px) rotate(180deg) scale(1.5);
    }
}

/* =========================
   КОНТЕНТ
========================= */

.page{
    position:relative;
    z-index:3;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:32px 15px 70px;
}

.quiz-card{
    position:relative;

    width:min(760px,94vw);

    padding:42px 44px 40px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(7,5,24,.91),
            rgba(4,3,17,.96)
        );

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border:
        1px solid
        color-mix(in srgb,var(--energy) 45%,transparent);

    box-shadow:
        -18px 0 55px
        color-mix(in srgb,var(--left) 15%,transparent),

        18px 0 55px
        color-mix(in srgb,var(--right) 15%,transparent),

        0 0 35px
        color-mix(in srgb,var(--energy) 15%,transparent),

        inset 0 0 45px rgba(255,255,255,.018);

    overflow:hidden;

    transition:.8s;
}

.quiz-card::before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:21px;
    border:1px solid rgba(255,255,255,.055);
    pointer-events:none;
}

.quiz-card::after{
    content:"✦";
    position:absolute;
    top:-15px;
    left:50%;
    transform:translateX(-50%);
    font-size:38px;
    color:var(--energy);

    text-shadow:
        0 0 10px var(--energy),
        0 0 25px var(--energy);
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:27px;
}

.main-orb{
    font-size:42px;

    filter:
        drop-shadow(0 0 10px var(--energy))
        drop-shadow(0 0 22px var(--energy));

    animation:orbPulse 2.4s ease-in-out infinite;
}

@keyframes orbPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.13)}
}

h1{
    margin:3px 0 0;

    font-family:'Cormorant Garamond',serif;

    font-size:46px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--left),
            #ffffff,
            var(--energy),
            var(--right)
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:titleGlow 7s linear infinite;
}

@keyframes titleGlow{
    to{
        background-position:200% center;
    }
}

.subtitle{
    margin:7px 0 0;

    font-family:'Cormorant Garamond',serif;

    font-size:19px;

    color:#cfc0dc;
}

/* =========================
   FORM
========================= */

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:flex;
    align-items:center;
    gap:8px;

    margin-bottom:8px;

    font-size:14px;
    font-weight:600;
    line-height:1.35;

    color:#fff5fb;
}

.icon{
    font-size:18px;
    color:var(--energy);

    filter:
        drop-shadow(0 0 6px var(--energy));
}

input,
select,
textarea{
    width:100%;

    padding:13px 15px;

    border-radius:12px;

    border:
        1px solid
        color-mix(in srgb,var(--energy) 42%,transparent);

    background:rgba(3,2,15,.76);

    color:#fff;

    outline:none;

    font-family:'Montserrat',sans-serif;
    font-size:14px;

    transition:.3s;
}

input::placeholder,
textarea::placeholder{
    color:#756a83;
}

select{
    cursor:pointer;
}

select option{
    background:#090616;
    color:#fff;
}

textarea{
    min-height:92px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    transform:translateY(-1px);

    border-color:var(--energy);

    box-shadow:
        0 0 20px
        color-mix(in srgb,var(--energy) 30%,transparent);
}

#zodiac1{
    border-color:
        color-mix(in srgb,var(--left) 75%,transparent);
}

#zodiac2{
    border-color:
        color-mix(in srgb,var(--right) 75%,transparent);
}

/* =========================
   ПРЕВЬЮ
========================= */

.compatibility-preview{
    margin:0 0 20px;

    padding:14px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.10);

    background:
        linear-gradient(
            90deg,
            color-mix(in srgb,var(--left) 16%,transparent),
            rgba(255,255,255,.025),
            color-mix(in srgb,var(--right) 16%,transparent)
        );

    text-align:center;

    font-family:'Cormorant Garamond',serif;

    font-size:21px;
}

/* =========================
   ENERGY
========================= */

.energy-info{
    margin-top:8px;

    padding:11px 13px;

    border-radius:11px;

    border:
        1px solid
        color-mix(in srgb,var(--energy) 25%,transparent);

    background:
        color-mix(in srgb,var(--energy) 8%,transparent);

    color:#cdbbd9;

    font-family:'Cormorant Garamond',serif;
    font-size:16px;
    line-height:1.4;
}

/* =========================
   BUTTON
========================= */

button{
    position:relative;

    width:100%;

    margin-top:8px;

    padding:16px 20px;

    border:0;
    border-radius:50px;

    cursor:pointer;

    color:#fff;

    font-family:'Montserrat',sans-serif;

    font-size:15px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--left),
            var(--energy),
            var(--right)
        );

    background-size:200% 100%;

    box-shadow:
        0 0 18px
        color-mix(in srgb,var(--energy) 35%,transparent);

    overflow:hidden;

    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    background-position:100% 0;
}

button:disabled{
    opacity:.8;
    cursor:default;
}

button::before{
    content:"";

    position:absolute;
    top:0;
    left:-100%;

    width:65%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3s infinite;
}

@keyframes shine{
    0%{left:-100%}
    40%,100%{left:150%}
}

/* =========================
   MAGIC
========================= */

.hidden{
    display:none!important;
}

#magicBlock{
    text-align:center;
    padding:35px 10px;
}

.magic-title{
    font-family:'Cormorant Garamond',serif;
    font-size:30px;
    margin-bottom:30px;
}

.magic-circle{
    position:relative;

    width:210px;
    height:210px;

    margin:0 auto 30px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.circle{
    position:absolute;
    inset:0;

    border-radius:50%;

    border:1px solid var(--left);

    box-shadow:
        0 0 20px var(--left);

    animation:rotate 6s linear infinite;
}

.circle:nth-child(2){
    inset:18px;
    border-color:var(--right);
    animation:rotateReverse 7s linear infinite;
}

.circle:nth-child(3){
    inset:38px;
    border-style:dashed;
    border-color:var(--energy);
    animation:rotate 4s linear infinite;
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

@keyframes rotateReverse{
    to{transform:rotate(-360deg)}
}

.magic-rune{
    font-size:58px;

    filter:
        drop-shadow(0 0 15px var(--energy));

    animation:orbPulse 1.6s infinite;
}

.magic-status{
    min-height:30px;

    font-family:'Cormorant Garamond',serif;

    font-size:22px;

    color:#cdbbd8;
}

/* =========================
   RESULT
========================= */

#successBlock{
    text-align:center;
    padding:20px 5px;
}

.success-title{
    font-family:'Cormorant Garamond',serif;
    font-size:31px;
}

.result-pair{
    font-family:'Cormorant Garamond',serif;
    font-size:25px;
    margin:15px 0;
}

#percentResult{
    display:block;

    font-size:74px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--left),
            var(--energy),
            var(--right)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.verdict-text{
    max-width:600px;
    margin:15px auto;

    font-family:'Cormorant Garamond',serif;
    font-size:21px;
    line-height:1.6;

    color:#ded0e7;
}

.result-detail{
    margin-top:20px;

    padding:16px;

    border-radius:14px;

    border:
        1px solid
        color-mix(in srgb,var(--energy) 20%,transparent);

    background:
        color-mix(
            in srgb,
            var(--energy) 5%,
            rgba(3,2,15,.60)
        );

    font-family:'Cormorant Garamond',serif;

    font-size:18px;

    line-height:1.5;

    color:#cdbbd8;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .page{
        padding:12px 8px 40px;
    }

    .quiz-card{
        width:100%;
        padding:35px 18px 30px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:17px;
    }

    #percentResult{
        font-size:58px;
    }

    .zodiac-side{
        width:100%;
        opacity:.45;
    }

    .right-side{
        display:none;
    }
}
</style>
</head>

};

const energyThemes = {
    "Влюблённая энергия 💗":{
        accent:"#ff4f9c",
        symbol:"💗",
        text:"💗 Сердце открыто любви, теплу, нежности и сильному притяжению."
    },

    "Загадочная энергия 🔮":{
        accent:"#a855ff",
        symbol:"🔮",
        text:"🔮 Тайны, знаки судьбы и ощущение чего-то необычного окружают тебя."
    },

    "Авантюрная энергия ⚡":{
        accent:"#ff9d38",
        symbol:"⚡",
        text:"⚡ Судьба готовит приключения, движение и неожиданные повороты."
    },

    "Спокойная энергия 🌙":{
        accent:"#6da5ff",
        symbol:"🌙",
        text:"🌙 Спокойствие усиливает доверие, искренность и глубокие чувства."
    },

    "Дерзкая энергия 😎":{
        accent:"#ff477e",
        symbol:"😎",
        text:"😎 Сегодня хочется играть по своим правилам и бросить судьбе вызов."
    }
};

const form = document.getElementById("loveForm");
const zodiac1 = document.getElementById("zodiac1");
const zodiac2 = document.getElementById("zodiac2");
const feelings = document.getElementById("feelings");
const preview = document.getElementById("compatibilityPreview");
const energyInfo = document.getElementById("energyInfo");
const magicRune = document.getElementById("magicRune");
const magicBlock = document.getElementById("magicBlock");
const successBlock = document.getElementById("successBlock");
const magicStatus = document.getElementById("magicStatus");

const leftBackground = document.getElementById("leftBackground");
const rightBackground = document.getElementById("rightBackground");

/* =========================
   ПРОВЕРКА И УСТАНОВКА ФОНА
========================= */

function setBackground(element, imagePath){

    const image = new Image();

    image.onload = ()=>{
        element.style.backgroundImage =
            `url('${imagePath}')`;
    };

    image.onerror = ()=>{
        console.error(
            "Не найдена картинка:",
            imagePath
        );

        element.style.backgroundImage = "none";
        element.style.backgroundColor = "#080617";
    };

    image.src = imagePath;
}

/* =========================
   СМЕНА ФОНОВ
========================= */

function updateBackgrounds(){

    const leftImage =
        zodiac1.value
        ? "./" + zodiacBackgrounds[zodiac1.value]
        : DEFAULT_BG;

    const rightImage =
        zodiac2.value
        ? "./" + zodiacBackgrounds[zodiac2.value]
        : DEFAULT_BG;

    setBackground(
        leftBackground,
        leftImage
    );

    setBackground(
        rightBackground,
        rightImage
    );
}

/* =========================
   ТЕМА
========================= */

function applyTheme(){

    let leftElement = "water";
    let rightElement = "fire";

    if(zodiac1.value && zodiacData[zodiac1.value]){
        leftElement = zodiacData[zodiac1.value].element;
    }

    if(zodiac2.value && zodiacData[zodiac2.value]){
        rightElement = zodiacData[zodiac2.value].element;
    }

    const leftTheme = zodiacThemes[leftElement];
    const rightTheme = zodiacThemes[rightElement];
    const energyTheme = energyThemes[feelings.value];

    document.documentElement.style.setProperty(
        "--left",
        leftTheme.color
    );

    document.documentElement.style.setProperty(
        "--right",
        rightTheme.color
    );

    document.documentElement.style.setProperty(
        "--energy",
        energyTheme.accent
    );

    energyInfo.innerText = energyTheme.text;
    magicRune.innerText = energyTheme.symbol;
}

/* =========================
   ПРЕВЬЮ
========================= */

function updatePreview(){

    if(zodiac1.value && zodiac2.value){

        const z1 = zodiacData[zodiac1.value];
        const z2 = zodiacData[zodiac2.value];

        preview.innerHTML =
            `
            <span style="
                color:var(--left);
                text-shadow:0 0 10px var(--left);
            ">
                ${z1.symbol} ${z1.name}
            </span>

            <span style="
                margin:0 15px;
                color:#fff;
            ">
                ×
            </span>

            <span style="
                color:var(--right);
                text-shadow:0 0 10px var(--right);
            ">
                ${z2.name} ${z2.symbol}
            </span>
            `;

    }else{

        preview.innerHTML =
            `
            <span style="color:var(--left)">✦</span>
            &nbsp; Выбери два знака &nbsp;
            <span style="color:var(--right)">✦</span>
            `;
    }
}

/* =========================
   EVENTS
========================= */

zodiac1.addEventListener(
    "change",
    ()=>{
        updateBackgrounds();
        applyTheme();
        updatePreview();
    }
);

zodiac2.addEventListener(
    "change",
    ()=>{
        updateBackgrounds();
        applyTheme();
        updatePreview();
    }
);

feelings.addEventListener(
    "change",
    ()=>{
        applyTheme();
    }
);

/* =========================
   СТАРТ
========================= */

updateBackgrounds();
applyTheme();
updatePreview();

/* =========================
   SUBMIT
========================= */

form.addEventListener(
    "submit",
    async(e)=>{

        e.preventDefault();

        const button = form.querySelector("button");

        const payload = {
            name:document.getElementById("name").value,
            zodiac1:zodiac1.value,
            zodiac2:zodiac2.value,
            feelings:feelings.value,
            date:document.getElementById("date").value,
            place:document.getElementById("place").value,
            time:document.getElementById("time").value,
            message:document.getElementById("message").value
        };

        button.disabled = true;

        form.classList.add("hidden");
        magicBlock.classList.remove("hidden");

        const z1 = zodiacData[zodiac1.value];
        const z2 = zodiacData[zodiac2.value];

        const messages = [
            `Открываем портал между ${z1.name} и ${z2.name}`,
            "Пробуждаем силы стихий",
            "Читаем энергию сердца",
            "Соединяем ваши созвездия",
            "Ищем скрытое притяжение",
            "Заглядываем в книгу судьбы",
            "Магический анализ почти завершён..."
        ];

        let index = 0;

        magicStatus.innerText = messages[0];

        const interval =
            setInterval(
                ()=>{
                    index++;

                    if(index < messages.length){
                        magicStatus.innerText = messages[index];
                    }
                },
                900
            );

        try{

            const response =
                await fetch(
                    "https://ser-4983.onrender.com/api/send",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":"application/json"
                        },

                        body:JSON.stringify(payload)
                    }
                );

            const result = await response.json();

            clearInterval(interval);

            magicBlock.classList.add("hidden");

            if(result.success){

                successBlock.classList.remove("hidden");

                document.getElementById("resultPair").innerHTML =
                    `
                    <span style="color:var(--left)">
                        ${z1.symbol} ${z1.name}
                    </span>

                    &nbsp; × &nbsp;

                    <span style="color:var(--right)">
                        ${z2.name} ${z2.symbol}
                    </span>
                    `;

                document.getElementById("percentResult").innerText =
                    result.percentage + "%";

                document.getElementById("verdictResult").innerText =
                    result.verdict;

                document.getElementById("energyResult").innerText =
                    result.energyVerdict || "";

            }else{

                form.classList.remove("hidden");
                button.disabled = false;

                alert(
                    "Ошибка: " +
                    (
                        result.error ||
                        "неизвестная ошибка"
                    )
                );
            }

        }catch(error){

            clearInterval(interval);

            magicBlock.classList.add("hidden");
            form.classList.remove("hidden");

            button.disabled = false;

            alert(
                "Магический сервер просыпается. Подожди немного и попробуй снова."
            );

            console.error(error);
        }
    }
);

</script>
