<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Тайна Совместимости 🔮</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

:root{
    --left:#5175ff;
    --left2:#9c4cff;

    --right:#ff445a;
    --right2:#ff9d38;

    --energy:#ff4f9c;

    --text:#fff4fb;
    --muted:#cdbbd8;
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Montserrat',sans-serif;
    color:var(--text);
    background:#03020d;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:35px 15px 70px;
    overflow-x:hidden;
}

/* =========================
   МАГИЧЕСКИЙ МИР
========================= */

.magic-world{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
    background:
        linear-gradient(
            90deg,
            #040419 0%,
            #060417 44%,
            #070315 56%,
            #130307 100%
        );
}

.magic-world::before{
    content:"";
    position:absolute;
    inset:0 50% 0 0;

    background:
        radial-gradient(
            circle at 20% 18%,
            color-mix(in srgb,var(--left) 46%,transparent),
            transparent 26%
        ),
        radial-gradient(
            circle at 45% 55%,
            color-mix(in srgb,var(--left2) 24%,transparent),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            rgba(4,5,35,.10),
            rgba(15,10,70,.30),
            rgba(20,5,45,.58)
        );

    transition:1s;
}

.magic-world::after{
    content:"";
    position:absolute;
    inset:0 0 0 50%;

    background:
        radial-gradient(
            circle at 80% 18%,
            color-mix(in srgb,var(--right) 48%,transparent),
            transparent 27%
        ),
        radial-gradient(
            circle at 55% 60%,
            color-mix(in srgb,var(--right2) 26%,transparent),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            rgba(35,4,14,.10),
            rgba(70,7,25,.28),
            rgba(30,3,15,.58)
        );

    transition:1s;
}

/* =========================
   ЗВЁЗДЫ
========================= */

.stars,
.stars::before,
.stars::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#d9c8ff 1px,transparent 1px),
        radial-gradient(circle,#ff8fcf 1px,transparent 1px);

    background-size:
        95px 115px,
        167px 151px,
        221px 187px;

    opacity:.4;
}

.stars{
    animation:starsMove 26s linear infinite;
}

.stars::before{
    transform:translateY(60px);
    opacity:.22;
}

.stars::after{
    transform:translateX(40px);
    opacity:.17;
}

@keyframes starsMove{
    from{transform:translateY(0)}
    to{transform:translateY(-120px)}
}

/* =========================
   ЛУНА СЛЕВА
========================= */

.moon{
    position:absolute;
    left:5vw;
    top:8vh;

    width:190px;
    height:190px;

    border-radius:50%;

    border:8px solid var(--left);
    border-right-color:transparent;
    border-bottom-color:transparent;

    transform:rotate(-35deg);

    filter:
        drop-shadow(0 0 12px var(--left))
        drop-shadow(0 0 40px var(--left2));

    opacity:.95;

    transition:1s;
}

.moon::after{
    content:"✦";
    position:absolute;
    right:-40px;
    top:35px;
    color:#fff;
    font-size:22px;
    text-shadow:0 0 12px var(--left);
}

/* =========================
   ЗОДИАК СПРАВА
========================= */

.zodiac-wheel{
    position:absolute;
    right:-75px;
    top:12vh;

    width:350px;
    height:350px;

    border-radius:50%;

    border:
        2px solid
        color-mix(in srgb,var(--right) 65%,transparent);

    box-shadow:
        0 0 22px
        color-mix(in srgb,var(--right) 45%,transparent),
        inset 0 0 28px
        color-mix(in srgb,var(--right2) 20%,transparent);

    animation:rotateWheel 55s linear infinite;
    transition:1s;
}

.zodiac-wheel::before{
    content:"♈  ♉  ♊  ♋  ♌  ♍  ♎  ♏  ♐  ♑  ♒  ♓";
    position:absolute;
    inset:42px;
    border-radius:50%;

    border:
        1px dashed
        color-mix(in srgb,var(--right2) 70%,transparent);

    color:var(--right2);
    font-size:21px;
    line-height:260px;
    text-align:center;
    word-spacing:7px;

    text-shadow:
        0 0 10px var(--right);
}

.zodiac-wheel::after{
    content:"✦";
    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:#fff;
    font-size:30px;

    text-shadow:
        0 0 14px var(--right),
        0 0 30px var(--right2);
}

@keyframes rotateWheel{
    to{transform:rotate(360deg)}
}

/* =========================
   МАГИЧЕСКАЯ ЗЕМЛЯ
========================= */

.magic-ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:35vh;

    background:
        radial-gradient(
            ellipse at 20% 100%,
            color-mix(in srgb,var(--left) 30%,transparent),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 80% 100%,
            color-mix(in srgb,var(--right) 30%,transparent),
            transparent 45%
        ),
        linear-gradient(
            to top,
            rgba(0,0,8,.92),
            transparent
        );
}

.magic-ground::before{
    content:"";
    position:absolute;
    bottom:0;
    left:0;

    width:50%;
    height:190px;

    background:
        linear-gradient(
            145deg,
            transparent 35%,
            rgba(20,18,50,.85) 36%,
            rgba(10,8,30,.95) 57%,
            transparent 58%
        );
}

.magic-ground::after{
    content:"";
    position:absolute;
    bottom:0;
    right:0;

    width:50%;
    height:190px;

    background:
        linear-gradient(
            215deg,
            transparent 35%,
            rgba(55,10,20,.85) 36%,
            rgba(25,5,15,.95) 57%,
            transparent 58%
        );
}

/* =========================
   ДЕКОР
========================= */

.magic-decoration{
    position:absolute;
    font-size:38px;
    filter:drop-shadow(0 0 12px currentColor);
    animation:floatMagic 4s ease-in-out infinite;
}

.crystal-left{
    left:8%;
    bottom:11%;
    color:var(--left);
}

.book-left{
    left:3%;
    bottom:4%;
    font-size:50px;
    color:#b998ff;
}

.crystal-right{
    right:8%;
    bottom:10%;
    color:var(--right);
}

.fire-right{
    right:3%;
    bottom:4%;
    font-size:48px;
    color:#ff724c;
}

@keyframes floatMagic{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

/* =========================
   ЧАСТИЦЫ
========================= */

.particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.particles span{
    position:absolute;
    opacity:0;
    animation:particleFloat 8s linear infinite;
}

.particles span:nth-child(odd){
    color:var(--left);
}

.particles span:nth-child(even){
    color:var(--right);
}

.particles span:nth-child(1){left:5%;top:75%}
.particles span:nth-child(2){left:16%;top:48%;animation-delay:2s}
.particles span:nth-child(3){left:30%;top:90%;animation-delay:4s}
.particles span:nth-child(4){left:73%;top:80%;animation-delay:1s}
.particles span:nth-child(5){left:87%;top:50%;animation-delay:3s}
.particles span:nth-child(6){left:95%;top:75%;animation-delay:5s}

@keyframes particleFloat{
    0%{
        opacity:0;
        transform:translateY(30px) rotate(0);
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:.8;
    }

    100%{
        opacity:0;
        transform:translateY(-170px) rotate(180deg);
    }
}

/* =========================
   ЗАТЕМНЕНИЕ ПОД ФОРМОЙ
========================= */

.center-shadow{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(3,2,12,.10) 20%,
            rgba(3,2,15,.48) 34%,
            rgba(3,2,15,.78) 46%,
            rgba(3,2,15,.78) 54%,
            rgba(3,2,15,.48) 66%,
            rgba(3,2,12,.10) 80%,
            transparent 100%
        );
}

/* =========================
   ОСНОВНАЯ ФОРМА
========================= */

.quiz-card{
    position:relative;
    z-index:3;

    width:min(760px,94vw);

    padding:42px 44px 40px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(8,6,27,.88),
            rgba(5,3,18,.94)
        );

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    border:
        1px solid
        color-mix(in srgb,var(--energy) 42%,transparent);

    box-shadow:
        -15px 0 50px
        color-mix(in srgb,var(--left) 15%,transparent),

        15px 0 50px
        color-mix(in srgb,var(--right) 15%,transparent),

        0 0 35px
        color-mix(in srgb,var(--energy) 16%,transparent),

        inset 0 0 45px rgba(255,255,255,.018);

    overflow:hidden;
}

.quiz-card::before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:21px;
    border:1px solid rgba(255,255,255,.055);
    pointer-events:none;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:26px;
}

.main-orb{
    font-size:42px;

    filter:
        drop-shadow(0 0 10px var(--energy))
        drop-shadow(0 0 23px var(--energy));

    animation:pulse 2.4s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.13)}
}

h1{
    margin:4px 0 0;

    font-family:'Cormorant Garamond',serif;
    font-size:46px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--left),
            #fff,
            var(--energy),
            var(--right)
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:titleGlow 7s linear infinite;
}

@keyframes titleGlow{
    to{
        background-position:200% center;
    }
}

.subtitle{
    margin:7px 0 0;
    font-family:'Cormorant Garamond',serif;
    font-size:19px;
    color:#cfc0dc;
}

/* =========================
   ФОРМА
========================= */

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;

    font-size:14px;
    font-weight:600;
    color:#fff5fb;
}

.icon{
    font-size:18px;
    color:var(--energy);

    filter:
        drop-shadow(0 0 6px var(--energy));
}

input,
select,
textarea{
    width:100%;

    padding:13px 15px;

    border-radius:12px;

    border:
        1px solid
        color-mix(in srgb,var(--energy) 42%,transparent);

    background:rgba(3,2,15,.72);

    color:#fff;

    outline:none;

    font-family:'Montserrat',sans-serif;
    font-size:14px;

    transition:.3s;
}

input::placeholder,
textarea::placeholder{
    color:#756a83;
}

select{
    cursor:pointer;
}

select option{
    background:#090616;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    transform:translateY(-1px);

    border-color:var(--energy);

    box-shadow:
        0 0 20px
        color-mix(in srgb,var(--energy) 30%,transparent);
}

#zodiac1{
    border-color:
        color-mix(in srgb,var(--left) 70%,transparent);
}

#zodiac2{
    border-color:
        color-mix(in srgb,var(--right) 70%,transparent);
}

/* =========================
   ПАРА ЗНАКОВ
========================= */

.compatibility-preview{
    margin:0 0 20px;

    padding:14px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.10);

    background:
        linear-gradient(
            90deg,
            color-mix(in srgb,var(--left) 14%,transparent),
            rgba(255,255,255,.025),
            color-mix(in srgb,var(--right) 14%,transparent)
        );

    text-align:center;

    font-family:'Cormorant Garamond',serif;
    font-size:21px;
}

/* =========================
   ENERGY
========================= */

.energy-info{
    margin-top:8px;

    padding:11px 13px;

    border-radius:11px;

    border:
        1px solid
        color-mix(in srgb,var(--energy) 25%,transparent);

    background:
        color-mix(in srgb,var(--energy) 8%,transparent);

    color:#cdbbd9;

    font-family:'Cormorant Garamond',serif;
    font-size:16px;
}

/* =========================
   BUTTON
========================= */

button{
    width:100%;
    margin-top:8px;

    padding:16px 20px;

    border:0;
    border-radius:50px;

    cursor:pointer;

    color:#fff;

    font-family:'Montserrat',sans-serif;
    font-size:15px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--left),
            var(--energy),
            var(--right)
        );

    background-size:200% 100%;

    box-shadow:
        0 0 18px
        color-mix(in srgb,var(--energy) 35%,transparent);

    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    background-position:100% 0;
}

button:disabled{
    opacity:.8;
    cursor:default;
}

/* =========================
   MAGIC LOADING
========================= */

.hidden{
    display:none!important;
}

#magicBlock{
    text-align:center;
    padding:35px 10px;
}

.magic-title{
    font-family:'Cormorant Garamond',serif;
    font-size:30px;
    margin-bottom:30px;
}

.magic-circle{
    position:relative;

    width:210px;
    height:210px;

    margin:0 auto 30px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.circle{
    position:absolute;
    inset:0;

    border-radius:50%;

    border:1px solid var(--left);

    box-shadow:
        0 0 20px var(--left);

    animation:rotate 6s linear infinite;
}

.circle:nth-child(2){
    inset:18px;
    border-color:var(--right);
    animation:rotateReverse 7s linear infinite;
}

.circle:nth-child(3){
    inset:38px;
    border-style:dashed;
    border-color:var(--energy);
    animation:rotate 4s linear infinite;
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

@keyframes rotateReverse{
    to{transform:rotate(-360deg)}
}

.magic-rune{
    font-size:58px;
    filter:drop-shadow(0 0 15px var(--energy));
    animation:pulse 1.6s infinite;
}

.magic-status{
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
    color:#cdbbd8;
}

/* =========================
   RESULT
========================= */

#successBlock{
    text-align:center;
    padding:20px 5px;
}

.success-title{
    font-family:'Cormorant Garamond',serif;
    font-size:31px;
}

.result-pair{
    font-family:'Cormorant Garamond',serif;
    font-size:25px;
    margin:15px 0;
}

#percentResult{
    display:block;

    font-size:74px;
    font-weight:700;

    background:
        linear-gradient(
            90deg,
            var(--left),
            var(--energy),
            var(--right)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.verdict-text{
    max-width:600px;
    margin:15px auto;

    font-family:'Cormorant Garamond',serif;
    font-size:21px;
    line-height:1.6;

    color:#ded0e7;
}

.result-detail{
    margin-top:20px;

    padding:16px;

    border-radius:14px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.08);

    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    line-height:1.5;

    color:#cdbbd8;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        padding:14px 8px 40px;
    }

    .quiz-card{
        width:100%;
        padding:35px 18px 30px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    h1{
        font-size:34px;
    }

    .moon{
        width:120px;
        height:120px;
        left:-25px;
    }

    .zodiac-wheel{
        width:220px;
        height:220px;
        right:-120px;
    }

    .magic-decoration{
        opacity:.55;
    }
}
</style>
</head>

type="text"
id="place"
required
placeholder="Например: на крыше с красивым видом..."
>

</div>

<div class="form-group">

<label>
<span class="icon">◷</span>
Когда звёзды должны пересечься?
</label>

<input
type="text"
id="time"
required
placeholder="Например: вечером под полной луной..."
>

</div>

<div class="form-group">

<label>
<span class="icon">🔐</span>
Тайное послание
</label>

<textarea
id="message"
placeholder="Ты — моё самое красивое приключение..."
></textarea>

</div>

<button type="submit">
✨ Узнать совместимость ✨
</button>

</form>

<div
id="magicBlock"
class="hidden"
>

<div class="magic-title">
Магический ритуал начался...
</div>

<div class="magic-circle">

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div
class="magic-rune"
id="magicRune"
>
💗
</div>

</div>

<div
class="magic-status"
id="magicStatus"
>
Соединяем созвездия...
</div>

</div>

<div
id="successBlock"
class="hidden"
>

<div class="success-title">
✨ Результат Магического Анализа ✨
</div>

<div
class="result-pair"
id="resultPair"
></div>

<span id="percentResult">
0%
</span>

<p
class="verdict-text"
id="verdictResult"
>
Звёзды ещё молчат...
</p>

<div
class="result-detail"
id="energyResult"
></div>

</div>

</div>

<script>

const zodiacData={

овен:{
name:"Овен",
symbol:"♈",
element:"fire"
},

телец:{
name:"Телец",
symbol:"♉",
element:"earth"
},

близнецы:{
name:"Близнецы",
symbol:"♊",
element:"air"
},

рак:{
name:"Рак",
symbol:"♋",
element:"water"
},

лев:{
name:"Лев",
symbol:"♌",
element:"fire"
},

дева:{
name:"Дева",
symbol:"♍",
element:"earth"
},

весы:{
name:"Весы",
symbol:"♎",
element:"air"
},

скорпион:{
name:"Скорпион",
symbol:"♏",
element:"water"
},

стрелец:{
name:"Стрелец",
symbol:"♐",
element:"fire"
},

козерог:{
name:"Козерог",
symbol:"♑",
element:"earth"
},

водолей:{
name:"Водолей",
symbol:"♒",
element:"air"
},

рыбы:{
name:"Рыбы",
symbol:"♓",
element:"water"
}

};

const zodiacThemes={

fire:{
color:"#ff445a",
color2:"#ff9d38"
},

earth:{
color:"#d6a24e",
color2:"#73aa59"
},

air:{
color:"#4edfff",
color2:"#6577ff"
},

water:{
color:"#5175ff",
color2:"#9c4cff"
}

};

const energyThemes={

"Влюблённая энергия 💗":{
accent:"#ff4f9c",
symbol:"💗",
text:"💗 Сердце открыто любви, теплу, нежности и сильному притяжению."
},

"Загадочная энергия 🔮":{
accent:"#a855ff",
symbol:"🔮",
text:"🔮 Тайны, знаки судьбы и ощущение чего-то необычного окружают тебя."
},

"Авантюрная энергия ⚡":{
accent:"#ff9d38",
symbol:"⚡",
text:"⚡ Судьба готовит приключения, движение и неожиданные повороты."
},

"Спокойная энергия 🌙":{
accent:"#6da5ff",
symbol:"🌙",
text:"🌙 Спокойствие усиливает доверие, искренность и глубокие чувства."
},

"Дерзкая энергия 😎":{
accent:"#ff477e",
symbol:"😎",
text:"😎 Сегодня хочется играть по своим правилам и бросить судьбе вызов."
}

};

const form=
document.getElementById("loveForm");

const zodiac1=
document.getElementById("zodiac1");

const zodiac2=
document.getElementById("zodiac2");

const feelings=
document.getElementById("feelings");

const preview=
document.getElementById("compatibilityPreview");

const energyInfo=
document.getElementById("energyInfo");

const magicRune=
document.getElementById("magicRune");

const magicBlock=
document.getElementById("magicBlock");

const successBlock=
document.getElementById("successBlock");

const magicStatus=
document.getElementById("magicStatus");

function applyTheme(){

let leftElement="water";
let rightElement="fire";

if(
zodiac1.value &&
zodiacData[zodiac1.value]
){
leftElement=
zodiacData[zodiac1.value].element;
}

if(
zodiac2.value &&
zodiacData[zodiac2.value]
){
rightElement=
zodiacData[zodiac2.value].element;
}

const leftTheme=
zodiacThemes[leftElement];

const rightTheme=
zodiacThemes[rightElement];

const energyTheme=
energyThemes[feelings.value];

document.documentElement.style.setProperty(
"--left",
leftTheme.color
);

document.documentElement.style.setProperty(
"--left2",
leftTheme.color2
);

document.documentElement.style.setProperty(
"--right",
rightTheme.color
);

document.documentElement.style.setProperty(
"--right2",
rightTheme.color2
);

document.documentElement.style.setProperty(
"--energy",
energyTheme.accent
);

energyInfo.innerText=
energyTheme.text;

magicRune.innerText=
energyTheme.symbol;

}

function updatePreview(){

if(
zodiac1.value &&
zodiac2.value
){

const z1=
zodiacData[zodiac1.value];

const z2=
zodiacData[zodiac2.value];

preview.innerHTML=
`
<span style="
color:var(--left);
text-shadow:0 0 10px var(--left);
">
${z1.symbol} ${z1.name}
</span>

<span style="
margin:0 15px;
color:#fff;
">
×
</span>

<span style="
color:var(--right);
text-shadow:0 0 10px var(--right);
">
${z2.name} ${z2.symbol}
</span>
`;

}else{

preview.innerHTML=
`
<span style="color:var(--left)">
✦
</span>

&nbsp; Выбери два знака &nbsp;

<span style="color:var(--right)">
✦
</span>
`;

}

}

zodiac1.addEventListener(
"change",
()=>{
applyTheme();
updatePreview();
}
);

zodiac2.addEventListener(
"change",
()=>{
applyTheme();
updatePreview();
}
);

feelings.addEventListener(
"change",
()=>{
applyTheme();
}
);

applyTheme();

form.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const button=
form.querySelector("button");

const payload={

name:
document.getElementById("name").value,

zodiac1:
zodiac1.value,

zodiac2:
zodiac2.value,

feelings:
feelings.value,

date:
document.getElementById("date").value,

place:
document.getElementById("place").value,

time:
document.getElementById("time").value,

message:
document.getElementById("message").value

};

button.disabled=true;

form.classList.add("hidden");

magicBlock.classList.remove("hidden");

const z1=
zodiacData[zodiac1.value];

const z2=
zodiacData[zodiac2.value];

const messages=[

`Открываем портал между ${z1.name} и ${z2.name}`,

"Пробуждаем силы стихий",

"Читаем энергию сердца",

"Соединяем ваши созвездия",

"Ищем скрытое притяжение",

"Заглядываем в книгу судьбы",

"Магический анализ почти завершён..."

];

let index=0;

magicStatus.innerText=
messages[0];

const interval=
setInterval(()=>{

index++;

if(index < messages.length){

magicStatus.innerText=
messages[index];

}

},900);

try{

const response=
await fetch(
"https://ser-4983.onrender.com/api/send",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:
JSON.stringify(payload)
}
);

const result=
await response.json();

clearInterval(interval);

magicBlock.classList.add(
"hidden"
);

if(result.success){

successBlock.classList.remove(
"hidden"
);

document.getElementById(
"resultPair"
).innerHTML=
`
<span style="color:var(--left)">
${z1.symbol} ${z1.name}
</span>

&nbsp; × &nbsp;

<span style="color:var(--right)">
${z2.name} ${z2.symbol}
</span>
`;

document.getElementById(
"percentResult"
).innerText=
result.percentage+"%";

document.getElementById(
"verdictResult"
).innerText=
result.verdict;

document.getElementById(
"energyResult"
).innerText=
result.energyVerdict || "";

}else{

form.classList.remove(
"hidden"
);

button.disabled=false;

alert(
"Ошибка: "+
(
result.error ||
"неизвестная ошибка"
)
);

}

}catch(error){

clearInterval(interval);

magicBlock.classList.add(
"hidden"
);

form.classList.remove(
"hidden"
);

button.disabled=false;

alert(
"Магический сервер просыпается. Подожди немного и попробуй снова."
);

console.error(error);

}

}
);

</script>

</body>
</html>
